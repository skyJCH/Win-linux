<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebCraft</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  background:#000;color:#fff;font-family:Consolas,"Microsoft YaHei",monospace
}
canvas{display:block}
button{font-family:inherit}
#startScreen{
  position:fixed;inset:0;z-index:100;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 30%,#2a5d84 0,#12283c 48%,#05090d 100%)
}
/* 缓慢飘动的光斑，让开始界面不只是静态渐变 */
#startScreen:before{
  content:"";position:absolute;inset:-30%;
  background:
    radial-gradient(circle at 20% 30%,#7fc8ff22 0,transparent 42%),
    radial-gradient(circle at 78% 22%,#8fffc322 0,transparent 38%),
    radial-gradient(circle at 62% 78%,#ffd98f1e 0,transparent 40%);
  animation:drift 26s ease-in-out infinite alternate;
  pointer-events:none
}
@keyframes drift{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  100%{transform:translate3d(2%,2%,0) scale(1.08)}
}
#startScreen>*{position:relative;z-index:2}
#startScreen h1{
  margin:0;font-size:64px;letter-spacing:10px;
  background:linear-gradient(#ffffff,#bfe4ff 55%,#78b8e0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #0e2c40) drop-shadow(0 10px 22px #000)
}
#startScreen .subtitle{
  margin:6px 0 20px;color:#9fd0ea;font-size:13px;letter-spacing:3px
}
#startScreen p{color:#aac7da;font-size:13px;line-height:1.8;text-align:center}
.bigBtn{
  width:320px;padding:14px;margin:6px;cursor:pointer;color:#fff;
  border:2px solid #ffffff55;border-radius:9px;font-size:16px;font-weight:bold;
  letter-spacing:2px;
  background:linear-gradient(#4b8caf,#245373);box-shadow:0 5px 0 #102c3e,0 10px 22px #0008;
  transition:transform .12s,filter .12s,box-shadow .12s
}
.bigBtn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 7px 0 #102c3e,0 14px 26px #000a}
.bigBtn:active{transform:translateY(1px);box-shadow:0 3px 0 #102c3e}
.bigBtn.creative{background:linear-gradient(#58a755,#2d6730)}
#seedRow{display:flex;gap:8px;align-items:center;margin:14px 0 2px}
#seedInput,.smallBtn{
  font:13px Consolas,"Microsoft YaHei",monospace;color:#fff;
  background:#0006;border:2px solid #ffffff40;border-radius:6px;padding:9px 12px;outline:none
}
#seedInput{width:250px;text-align:center;user-select:text}
#seedInput:focus{border-color:#8fd0ff;background:#000a}
.smallBtn{cursor:pointer;background:#2d4a63;padding:9px 13px}
.smallBtn:hover{filter:brightness(1.15)}
#pauseScreen{
  position:fixed;inset:0;z-index:90;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:#000a;backdrop-filter:blur(6px)
}
#pauseScreen h2{
  font-size:34px;margin:0 0 8px;letter-spacing:6px;
  background:linear-gradient(#fff,#a9d4f0);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 4px 12px #000)
}
#pauseScreen .pauseSub{color:#8fb6d8;font-size:12px;letter-spacing:2px;margin-bottom:18px}
/* 种子提示始终排在按钮之后（存档槽位按钮是后面动态插入的） */
#pauseSeed{order:99}
.pauseBtn{
  width:300px;padding:12px;margin:5px;cursor:pointer;color:#fff;
  border:2px solid #ffffff35;border-radius:8px;background:#33445a;font-size:15px;
  transition:background .12s,transform .12s,border-color .12s
}
.pauseBtn:hover{background:#3f556f;border-color:#8fd0ff88;transform:translateY(-1px)}
#crosshair{
  position:fixed;left:50%;top:50%;width:20px;height:20px;
  transform:translate(-50%,-50%);z-index:15;pointer-events:none
}
#crosshair:before,#crosshair:after{
  content:"";position:absolute;background:#fff;mix-blend-mode:difference
}
#crosshair:before{left:0;top:9px;width:20px;height:2px}
#crosshair:after{left:9px;top:0;width:2px;height:20px}
#hotbar{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:20;display:flex;gap:3px;padding:5px;
  background:#0008;border:2px solid #ffffff25;border-radius:8px
}
.slot{
  width:52px;height:52px;position:relative;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(#2a3040aa,#1b2030aa);
  border:2px solid #ffffff22;border-radius:6px;cursor:pointer;
  transition:border-color .1s,box-shadow .1s,transform .1s
}
.slot:hover{border-color:#ffffff66;transform:translateY(-1px)}
.slot.selected{border-color:#fff;box-shadow:0 0 10px #fff8,0 0 0 2px #0006 inset}
.slot .count{position:absolute;right:3px;bottom:1px;font-weight:bold;text-shadow:1px 1px #000}
.slot .key{position:absolute;left:3px;top:0;font-size:10px;color:#ddd;text-shadow:1px 1px #000}
.icon{font-size:29px;line-height:1;filter:drop-shadow(1px 2px 1px #0006)}
.blockIcon{
  width:30px;height:30px;border:1px solid #ffffff66;
  background:repeating-linear-gradient(45deg,#777 0 4px,#999 4px 8px);
  box-shadow:inset -6px -6px #0004,inset 5px 5px #fff2
}
#status{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%);
  z-index:19;text-align:center;pointer-events:none;text-shadow:1px 1px #000
}
#hearts,#foods{font-size:18px;letter-spacing:1px;margin-top:4px}
#xpTrack{width:350px;height:7px;background:#0008;border:1px solid #fff5;margin:auto}
#xpFill{height:100%;width:0;background:#65d522}
#debug{
  position:fixed;left:7px;top:7px;z-index:25;display:none;
  padding:6px 9px;background:#0009;color:#9f9;font-size:11px;white-space:pre
}
#toast{
  position:fixed;left:50%;top:17%;transform:translateX(-50%);
  z-index:120;padding:8px 15px;background:#000d;border:1px solid #fff4;
  border-radius:6px;opacity:0;transition:.2s;pointer-events:none
}
#toast.show{opacity:1}
.panel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:40;display:none;padding:16px;background:#171b24f7;
  border:2px solid #ffffff30;border-radius:11px;
  box-shadow:0 14px 50px #000b,0 0 0 1px #0008 inset,0 1px 0 #ffffff18 inset;
  backdrop-filter:blur(4px)
}
.panel h3{
  margin:0 0 10px;font-size:15px;letter-spacing:2px;
  color:#dff1ff;text-shadow:0 2px 6px #000
}
.closeBtn{float:right;cursor:pointer;color:#aaa;margin-left:14px}
#inventoryPanel{width:660px;max-height:90vh;overflow:auto}
#inventoryGrid,#hotbarGrid,#creativeGrid{display:grid;grid-template-columns:repeat(9,52px);gap:3px}
#hotbarGrid{margin-top:12px;padding-top:10px;border-top:1px solid #fff3}
#creativePanel{margin:12px 0;padding:9px;background:#0004;border:1px solid #fff2;border-radius:6px}
#creativeGrid{grid-template-columns:repeat(9,52px)}
/* 创造物品栏的分类标签 */
#invTabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.invTab{
  padding:4px 9px;font-size:11px;color:#b9d3e6;cursor:pointer;
  background:#0006;border:1px solid #ffffff22;border-radius:12px;
  transition:background .1s,color .1s,border-color .1s
}
.invTab:hover{background:#2d4a63;color:#fff}
.invTab.active{background:#3f7fa8;color:#fff;border-color:#8fd0ff;font-weight:bold}
/* 物品格里的名称（方块太多时靠它分辨） */
.slot .slotName{
  position:absolute;left:0;right:0;bottom:-1px;font-size:8px;line-height:1.1;
  text-align:center;color:#eaf4ff;text-shadow:0 1px 2px #000,0 0 3px #000;
  background:linear-gradient(transparent,#000a);pointer-events:none;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:2px 1px 1px
}
#craftPanel{width:390px}
#craftGrid{display:grid;grid-template-columns:repeat(3,52px);gap:3px}
#craftResult{
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff4;background:#2229;border-radius:4px;cursor:pointer
}
#craftHint{min-height:18px;margin-top:8px;color:#ddb;font-size:12px}
#chestPanel{width:600px}
#chestGrid{display:grid;grid-template-columns:repeat(9,52px);gap:3px}
#chestPlayerGrid{display:grid;grid-template-columns:repeat(9,52px);gap:3px;margin-top:12px}
#modeTag,#dimTag{
  position:fixed;z-index:18;top:8px;padding:4px 11px;background:#0008;
  border:1px solid #fff3;border-radius:14px;font-size:11px;pointer-events:none
}
#modeTag{right:10px}
#dimTag{left:50%;transform:translateX(-50%)}
#loading{
  position:fixed;left:50%;top:74%;transform:translateX(-50%);z-index:101;
  color:#9bc;font-size:12px
}
#fatal{
  position:fixed;inset:auto 12px 12px 12px;z-index:200;display:none;
  max-height:42vh;overflow:auto;padding:12px;background:#390c0cf5;
  border:1px solid #ff7777;color:#ffdada;font:12px/1.5 monospace;white-space:pre-wrap
}
@media(max-width:700px){
  #startScreen h1{font-size:38px}
  #inventoryPanel,#chestPanel{width:96vw}
}
</style>
</head>

<body>
<div id="startScreen">
  <h1>WEBCRAFT</h1>
  <div class="subtitle">像素沙盒 · 无限世界</div>
  <button class="bigBtn" id="survivalBtn">▶ 生存模式</button>
  <button class="bigBtn creative" id="creativeBtn">✨ 创造模式</button>
  <div id="seedRow">
    <input id="seedInput" type="text" maxlength="24" autocomplete="off" spellcheck="false"
           placeholder="世界种子（留空 = 随机）">
    <button class="smallBtn" id="seedRandomBtn">🎲 随机</button>
  </div>
  <p>
    WASD 移动　空格跳跃　Shift 疾跑　左键挖掘　右键放置<br>
    E 背包　C 合成　1–9 快捷栏　Esc 暂停　F3 调试　F5 保存<br>
    同一串种子（数字或文字）永远生成同一个世界　/seed 查看或更换
  </p>
  <div id="loading">正在初始化 Three.js……</div>
</div>

<div id="pauseScreen">
  <h2>游戏暂停</h2>
  <div class="pauseSub">继续冒险，或整理你的世界</div>
  <button class="pauseBtn" id="resumeBtn">▶ 继续游戏</button>
  <button class="pauseBtn" id="saveBtn">💾 保存世界</button>
  <button class="pauseBtn" id="modeBtn">🔄 切换模式</button>
  <button class="pauseBtn" id="newWorldBtn">🌍 重新生成</button>
  <button class="pauseBtn" id="mainMenuBtn">🏠 返回主界面</button>
  <div class="pauseSub" id="pauseSeed" style="margin-top:14px;margin-bottom:0;font-size:11px;color:#6f8ba3"></div>
</div>

<div id="crosshair"></div>
<div id="modeTag"></div>
<div id="dimTag"></div>
<div id="status">
  <div id="xpTrack"><div id="xpFill"></div></div>
  <div id="hearts"></div>
  <div id="foods"></div>
</div>
<div id="hotbar"></div>
<div id="debug"></div>
<div id="toast"></div>

<div class="panel" id="inventoryPanel">
  <span class="closeBtn" data-close="inventoryPanel">✕</span>
  <h3>🎒 背包</h3>
  <div id="creativePanel">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:12px;color:#9fd0ea">✨ 创造物品栏</span>
      <input id="invSearch" type="text" placeholder="搜索方块 / 物品名…" autocomplete="off" spellcheck="false"
             style="flex:1;padding:5px 9px;font:12px inherit;color:#fff;background:#0007;border:1px solid #ffffff33;border-radius:5px;outline:none;user-select:text">
    </div>
    <div id="invTabs"></div>
    <div id="creativeGrid"></div>
    <div id="invHint" style="margin-top:8px;font-size:11px;color:#8fb6d8;min-height:16px">
      左键取一组到手上　·　右键直接放进背包　·　鼠标悬停看名称
    </div>
  </div>
  <div id="inventoryGrid"></div>
  <h3 style="font-size:13px;margin-top:12px">快捷栏</h3>
  <div id="hotbarGrid"></div>
</div>

<div class="panel" id="craftPanel">
  <span class="closeBtn" data-close="craftPanel">✕</span>
  <h3>🔨 合成台</h3>
  <div style="display:flex;align-items:center;gap:18px">
    <div id="craftGrid"></div>
    <div style="font-size:28px;color:#9bc">➜</div>
    <div id="craftResult"></div>
  </div>
  <div id="craftHint"></div>
</div>

<div class="panel" id="chestPanel">
  <span class="closeBtn" data-close="chestPanel">✕</span>
  <h3>📦 箱子</h3>
  <div id="chestGrid"></div>
  <h3 style="font-size:13px;margin-top:12px">背包</h3>
  <div id="chestPlayerGrid"></div>
</div>

<div id="fatal"></div>

<script>
window.addEventListener("error",function(e){
  const box=document.getElementById("fatal");
  if(!box)return;
  box.style.display="block";
  box.textContent+=
    "\n运行错误："+(e.message||e.type)+
    "\n文件："+(e.filename||"")+
    "\n行号："+(e.lineno||"")+
    "\n列号："+(e.colno||"")+
    "\n";
});
window.addEventListener("unhandledrejection",function(e){
  const box=document.getElementById("fatal");
  if(!box)return;
  box.style.display="block";
  box.textContent+="\nPromise 错误："+String(e.reason)+"\n";
});
</script>

/* 读取开始界面里的种子输入；留空则随机 */
function seedFromStartScreen(){
  const el=$("seedInput");
  const raw=el?el.value:"";
  const s=normalizeSeed(raw);
  return s===null?randomSeed():s;
}
function seedLabel(){
  return "世界种子 "+worldSeed;
}
function startGame(mode){
  started=true;
  $("startScreen").style.display="none";
  player.mode=mode;
  player.flying=mode==="creative";
  player.food=20;
  if(mode==="creative"){
    giveItem("flint",16);
    giveItem("flint_and_steel",1);
    giveItem("obsidian",64);
  }
  renderInventory();
  renderStats();
  renderHotbar();
  toast(mode==="creative"?"已进入创造模式":"已进入生存模式");
  setTimeout(()=>{if(started&&!worldLoading&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();},60);
}
$("survivalBtn").onclick=()=>startGame("survival");
$("creativeBtn").onclick=()=>startGame("creative");
const _seedRandomBtn=$("seedRandomBtn");
if(_seedRandomBtn)_seedRandomBtn.onclick=()=>{

};

/* 方块存储用数值键：字符串拼接 + 长字符串哈希是渲染时最大的开销之一 */
const BLK_OFF=1048576, BLK_AXIS=2097152, BLK_Y=64;
function blockKey(x,y,z){
  return ((x+BLK_OFF)*BLK_AXIS+(z+BLK_OFF))*128+(y+BLK_Y);
}
function getBlock(x,y,z){
  if(y<WH_MIN||y>=WH_MAX)return 0;
  return WORLDS[currentDim].get(blockKey(x,y,z))||0;
}
function setBlock(x,y,z,type,record=true){
  if(y<WH_MIN||y>=WH_MAX)return;
  const bk=blockKey(x,y,z);
  if(type)WORLDS[currentDim].set(bk,type);
  else WORLDS[currentDim].delete(bk);
  /* 存档里的修改记录仍然用可读的字符串键 */
  if(record&&!generating){
    const ed=EDITS[currentDim];
    ed.set(key3(x,y,z),type||0);
    /* 玩家改动记录也要有上限：水流/沙落/爆炸都会写这里，
       长期游玩同样会撞 Map 上限。超过就丢弃最旧的记录。 */
    if(ed.size>1200000){
      const overflow=ed.size-1000000;
      let i=0;
      for(const k of ed.keys()){
        ed.delete(k);
        if(++i>=overflow)break;
      }
    }
  }
}

/* ============================================================

   同一个种子 → 完全一致的地形（基岩、矿脉、洞穴、植被都一样）
   ============================================================ */
const LEGACY_SEED=0x51ed5eed;
let worldSeed=LEGACY_SEED;          // 新世界/后续运行时会改写
const BIOME={
  OCEAN:0,BEACH:1,PLAINS:2,FOREST:3,BIRCH:4,TAIGA:5,SNOW:6,
  DESERT:7,SAVANNA:8,MOUNTAIN:9,SWAMP:10,JUNGLE:11,
  CHERRY:12,MUSHROOM:13,BADLANDS:14,FROZEN_OCEAN:15,STONY_SHORE:16,
  DARK_FOREST:17,SNOWY_BEACH:18
};
const BIOME_NAMES={
  0:"海洋",1:"沙滩",2:"平原",3:"森林",4:"白桦林",5:"针叶林",6:"雪原",
  7:"沙漠",8:"热带草原",9:"山地",10:"沼泽",11:"丛林",12:"樱花林",
  13:"蘑菇岛",14:"恶地",15:"冻洋",16:"石岸",17:"黑森林",18:"积雪沙滩"
};

/* 把用户输入（数字 / 文字）变成 32 位种子；空输入返回 null */
function normalizeSeed(v){
  if(typeof v==="number"&&isFinite(v))return (v>>>0)||1;
  if(v===null||v===undefined)return null;
  const t=String(v).trim();
  if(!t)return null;
  if(/^-?\d+$/.test(t))return (parseInt(t,10)>>>0)||1;
  let h=2166136261>>>0;
  for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return h||1;
}
function randomSeed(){return ((Math.random()*4294967295)>>>0)||1;}

function hash2(x,z,salt){
  let h=Math.imul(x,374761393)^Math.imul(z,668265263)^Math.imul(salt,1274126177)^worldSeed;
  h=Math.imul(h^(h>>>13),1274126177);
  h^=h>>>16;
  return (h>>>0)/4294967296;
}
function hash3(x,y,z,salt){
  let h=Math.imul(x,374761393)^Math.imul(y,1103515245)^Math.imul(z,668265263)^Math.imul(salt,1274126177)^worldSeed;
  h=Math.imul(h^(h>>>13),1274126177);
  h^=h>>>16;
  return (h>>>0)/4294967296;
}
/* 整数哈希：只取低 3 位决定梯度方向，比取浮点更快 */
function hash2i(x,z,salt){
  let h=Math.imul(x,374761393)^Math.imul(z,668265263)^Math.imul(salt,1274126177)^worldSeed;
  h=Math.imul(h^(h>>>13),1274126177);
  return (h^(h>>>16))&7;
}
/* ---------------- 2D 柏林噪声（梯度噪声） ---------------- */
const G2X=[1,-1,0,0,0.7071,-0.7071,0.7071,-0.7071];
const G2Z=[0,0,1,-1,0.7071,0.7071,-0.7071,-0.7071];
const fade2=t=>t*t*t*(t*(t*6-15)+10);
/* 返回约 -1..1 的连续噪声；完全相同种子下可重复 */
function perlin2(x,z,salt){
  const xi=Math.floor(x),zi=Math.floor(z);
  const xf=x-xi,zf=z-zi;
  const u=fade2(xf),v=fade2(zf);
  const g00=hash2i(xi,zi,salt),g10=hash2i(xi+1,zi,salt);
  const g01=hash2i(xi,zi+1,salt),g11=hash2i(xi+1,zi+1,salt);
  const n00=G2X[g00]*xf+G2Z[g00]*zf;
  const n10=G2X[g10]*(xf-1)+G2Z[g10]*zf;
  const n01=G2X[g01]*xf+G2Z[g01]*(zf-1);
  const n11=G2X[g11]*(xf-1)+G2Z[g11]*(zf-1);
  const a=n00+(n10-n00)*u;
  const b=n01+(n11-n01)*u;
  return (a+(b-a)*v)*1.42;      /* 归一化到约 -1..1 */
}
/* 兼容原有调用：返回 0..1 */
function noise2(x,z,salt){
  const v=perlin2(x,z,salt)*.5+.5;
  return v<0?0:(v>1?1:v);
}
/* ---------------- 分形柏林噪声 fBm ---------------- */
/* 多个八度叠加：低频决定大地形，高频补细节，gain 控制粗糙度 */
let FBM_GAIN=.5;
function fbm2(x,z,salt,oct,lac,gain){
  lac=lac||2;
  gain=gain===undefined?.5:gain;
  let amp=1,f=1,sum=0,norm=0;
  for(let i=0;i<oct;i++){
    sum+=perlin2(x*f,z*f,salt+i*17)*amp;
    norm+=amp;
    amp*=gain;
    f*=lac;
  }
  return clamp(sum/norm*.5+.5,0,1);
}
/* 域扭曲：用低频噪声偏移采样坐标，让山脉/海岸线不再呈规则团块。
   注意是低频（x/220）——如果按方块级频率采样，相邻格会被推到几十格之外，
   地形就会变成一片悬崖。 */
function warp2(x,z,salt,strength){
  const wx=perlin2(x/220+5.2,z/220-3.1,salt)*strength;
  const wz=perlin2(x/220-7.3,z/220+9.4,salt+97)*strength;
  return {x:x+wx,z:z+wz};
}
/* ---------------- 柏林 3D 噪声 ---------------- */
function grad3(hash,x,y,z){
  /* 12 个梯度方向，用哈希选取 */
  switch(hash&11){
    case 0:return  x+y;
    case 1:return -x+y;
    case 2:return  x-y;
    case 3:return -x-y;
    case 4:return  x+z;
    case 5:return -x+z;
    case 6:return  x-z;
    case 7:return -x-z;
    case 8:return  y+z;
    case 9:return -y+z;
    case 10:return y-z;
    default:return -y-z;
  }
}
function hash3i(x,y,z,salt){
  let h=Math.imul(x,374761393)^Math.imul(y,1103515245)^Math.imul(z,668265263)^Math.imul(salt,1274126177)^worldSeed;
  h=Math.imul(h^(h>>>13),1274126177);
  return (h^(h>>>16))|0;
}
const PERLIN_FADE=t=>t*t*t*(t*(t*6-15)+10);
/* 返回 -1..1 的连续三维噪声（展开写法，避免每次调用创建闭包） */
function perlin3(x,y,z,salt){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=PERLIN_FADE(xf),v=PERLIN_FADE(yf),w=PERLIN_FADE(zf);
  const g000=grad3(hash3i(xi,yi,zi,salt),xf,yf,zf);
  const g100=grad3(hash3i(xi+1,yi,zi,salt),xf-1,yf,zf);
  const g010=grad3(hash3i(xi,yi+1,zi,salt),xf,yf-1,zf);
  const g110=grad3(hash3i(xi+1,yi+1,zi,salt),xf-1,yf-1,zf);
  const g001=grad3(hash3i(xi,yi,zi+1,salt),xf,yf,zf-1);
  const g101=grad3(hash3i(xi+1,yi,zi+1,salt),xf-1,yf,zf-1);
  const g011=grad3(hash3i(xi,yi+1,zi+1,salt),xf,yf-1,zf-1);
  const g111=grad3(hash3i(xi+1,yi+1,zi+1,salt),xf-1,yf-1,zf-1);
  const x00=g000+(g100-g000)*u;
  const x10=g010+(g110-g010)*u;
  const x01=g001+(g101-g001)*u;
  const x11=g011+(g111-g011)*u;
  const y0=x00+(x10-x00)*v;
  const y1=x01+(x11-x01)*v;
  return y0+(y1-y0)*w;   /* 约 -1..1 */
}
/* 三维分形柏林噪声 */
function fbm3(x,y,z,salt,oct,gain){
  gain=gain===undefined?.5:gain;
  let amp=1,f=1,sum=0,norm=0;
  for(let i=0;i<oct;i++){
    sum+=perlin3(x*f,y*f,z*f,salt+i*43)*amp;
    norm+=amp;
    amp*=gain;
    f*=2.02;
  }
  return sum/norm;
}
/* 山脊噪声：把柏林噪声取绝对值再反转，形成尖锐山脊 */
function ridged2(x,z,salt,oct){
  let amp=1,f=1,sum=0,norm=0;
  for(let i=0;i<oct;i++){
    const n=1-Math.abs(perlin2(x*f,z*f,salt+i*29));
    sum+=n*n*amp;
    norm+=amp;
    amp*=.55;
    f*=2.1;
  }
  return sum/norm;
}
function spread(v){return clamp((v-.5)*2.4+.5,0,1);}
function pixelNoise(x,y,seed){
  const n=Math.sin(x*12.9898+y*78.233+seed*37.719)*43758.5453123;
  return n-Math.floor(n);
}

/* ---------------- 气候（分形柏林噪声） ---------------- */
function climateAt(x,z){
  const w=warp2(x,z,171,18);
  return {
    temp:spread(fbm2(w.x/380,w.z/380,101,3,2,.5)*.72+
                fbm2(w.x/146,w.z/146,111,3,2,.5)*.28),
    hum:spread(fbm2(w.x/323,w.z/323,131,3,2,.5)*.70+
               fbm2(w.x/108,w.z/108,141,2,2,.5)*.30)
  };
}

/* ---------------- 高度（分形柏林噪声 + 域扭曲） ---------------- */
const SEA_COAST=.37;
function heightAt(x,z){
  /* 大尺度先用一层低频扭曲，海岸线和山体走向不再是规整团块 */
  const w=warp2(x,z,201,26);
  const cont=fbm2(w.x/760,w.z/760,11,5,2,.5);     // 大陆度 0..1
  const ero=fbm2(w.x/520,w.z/520,41,3,2,.5);      // 侵蚀度：越小越崎岖
  const detail=fbm2(x/64,z/64,51,5,2,.5);         // 局部起伏（细分更多）
  const hills=fbm2(x/180,z/180,71,3,2,.5);        // 丘陵
  const coast=cont-SEA_COAST;
  let h;
  if(coast<0){
    h=5+Math.max(-1,coast)*8+(detail-.5)*2;       // 海洋：5 ~ 13
    /* 海底也起伏一点，避免平原一样的水底 */
    h+=(fbm2(x/96,z/96,121,3,2,.6)-.5)*2.2;
  }else{
    h=SEA-1+Math.min(1,coast*5)*24;               // 海岸 → 内陆：15 ~ 39
    h+=(detail-.5)*8;
    h+=(hills-.5)*3;
    /* 山脉：用山脊噪声，越靠近大陆中心越陡 */
    const mountain=Math.max(0,cont-.60)*3.4*(1-ero);
    if(mountain>0)h+=ridged2(w.x/240,w.z/240,61,5)*mountain*26;
    /* 高频细节：让山坡有碎石感而不是光滑斜面 */
    h+=(fbm2(x/18,z/18,131,2,2,.55)-.5)*(coast>.10?1.2:0);
  }
  /* 河流：用平滑的“凹陷”代替硬 min()——硬切会在岸上留下一二十格的直壁，
     平滑凹陷则是一条缓坡河谷（宽度由 rv 控制，过渡自然） */
  const rv=Math.abs(fbm2(w.x/340,w.z/340,81,3,2,.5)-.5);
  if(rv<.045&&h>SEA-6){
    const t=1-rv/.045;                 /* 河心 1 → 岸边 0 */
    const bed=(SEA-1)-t*4;             /* 河床：比海平面略低 */
    h=h*(1-t*t)+bed*(t*t);             /* 二次曲线过渡，坡面连续 */
  }
  return Math.floor(clamp(h,BED_MIN+4,WH_MAX-6));
}

/* ---------------- 生物群系 ---------------- */
function biomeFrom(h,temp,hum,x,z){
  if(h<=SEA-2){
    return temp<.24?BIOME.FROZEN_OCEAN:BIOME.OCEAN;
  }
  if(h<=SEA+1){
    if(temp<.26)return BIOME.SNOWY_BEACH;
    return BIOME.BEACH;
  }
  if(h>=40)return BIOME.MOUNTAIN;
  const patch=noise2(x/46,z/46,151);
  const rare=noise2(x/190,z/190,161);      /* 稀有群系分布 */
  const dark=noise2(x/120,z/120,171);

  /* 蘑菇岛：湿且温和的孤岛，非常稀有 */
  if(hum>.80&&temp>.46&&temp<.76&&rare>.72)return BIOME.MUSHROOM;
  /* 樱花林：温和湿润的小片森林 */
  if(temp>.38&&temp<.62&&hum>.50&&hum<.80&&rare>.64)return BIOME.CHERRY;
  /* 恶地：干热 */
  if(temp>.76&&hum<.28)return BIOME.BADLANDS;
  /* 黑森林：湿润偏冷的密林 */
  if(hum>.62&&temp>.34&&temp<.60&&dark>.66)return BIOME.DARK_FOREST;
  /* 石岸：紧贴水面的岩石 */
  if(h<=SEA+2&&h>=SEA-2&&temp<.45)return BIOME.STONY_SHORE;

  if(h<=SEA+4&&hum>.62&&temp>.42&&patch<.5)return BIOME.SWAMP;
  if(temp<.30)return hum>.55?BIOME.TAIGA:BIOME.SNOW;
  if(temp>.70&&hum<.34)return BIOME.DESERT;
  if(temp>.60&&hum<.52)return BIOME.SAVANNA;
  if(hum>.72&&temp>.60)return BIOME.JUNGLE;
  if(hum>.56)return patch<.5?BIOME.BIRCH:BIOME.FOREST;
  if(temp<.44)return BIOME.TAIGA;
  if(hum<.34)return BIOME.PLAINS;
  return BIOME.FOREST;
}
function biomeAt(x,z,h){
  const ht=(h===undefined)?heightAt(x,z):h;
  const cl=climateAt(x,z);
  return biomeFrom(ht,cl.temp,cl.hum,x,z);
}
function surfaceFor(bi,h){
  switch(bi){
    case BIOME.OCEAN:return {top:6,sub:6,depth:3};
    case BIOME.FROZEN_OCEAN:return {top:90,sub:6,depth:2};      /* 浮冰 */
    case BIOME.BEACH:return {top:6,sub:6,depth:3};
    case BIOME.SNOWY_BEACH:return {top:13,sub:6,depth:2};
    case BIOME.STONY_SHORE:return {top:3,sub:10,depth:2};
    case BIOME.DESERT:return {top:6,sub:6,depth:4};
    case BIOME.BADLANDS:return {top:86,sub:86,depth:4};
    case BIOME.SNOW:return {top:13,sub:2,depth:1};
    case BIOME.MOUNTAIN:return {top:h>=42?13:3,sub:3,depth:2};
    case BIOME.MUSHROOM:return {top:1,sub:2,depth:3};
    case BIOME.SWAMP:return {top:1,sub:2,depth:3};
    default:return {top:1,sub:2,depth:3};
  }
}

/* ---------------- 洞穴 / 矿脉 ---------------- */
function caveAt(x,y,z){
  /* 柏林 3D 噪声：两条很窄的等值面带相交 → 细而稀疏的隧道，洞穴比以前更小。
     先算第一条，不满足就直接返回（第二条只在少数位置求值，省一半开销） */
  const bias=y<-24?.75:1;
  const w=.085*bias;
  const a=perlin3(x*.052,y*.085,z*.052,211);
  if(a>=w||a<=-w)return false;
  const b=perlin3(x*.047,y*.078,z*.047,212);
  return b<w&&b>-w;
}
function oreAt(x,y,z){
  const r=hash3(x,y,z,301);
  if(y<-30){
    if(r<.0012)return 26;   // 钻石
    if(r<.0022)return 29;   // 绿宝石
    if(r<.0055)return 27;   // 红石
    if(r<.0085)return 28;   // 青金石
    if(r<.0140)return 25;   // 金
    if(r<.0230)return 24;   // 铁
    if(r<.0360)return 23;   // 煤
    return 0;
  }
  if(y<8){
    if(r<.017)return 23;
    if(r<.028)return 24;
    if(r<.034)return 25;
    if(r<.038)return 27;
    return 0;
  }
  if(y<34){
    if(r<.012)return 23;
    if(r<.019)return 24;
    return 0;
  }
  return 0;
}

/* ---------------- 主世界区块生成 ---------------- */
function generateOverworldChunk(cx,cz){
  const x0=cx*CS,z0=cz*CS;
  generating=true;
  for(let lx=0;lx<CS;lx++)for(let lz=0;lz<CS;lz++){
    const x=x0+lx,z=z0+lz;
    const h=heightAt(x,z);
    const cl=climateAt(x,z);
    const bi=biomeFrom(h,cl.temp,cl.hum,x,z);
    const sf=surfaceFor(bi,h);
    const underwater=h<SEA;

    /* 基岩层 */
    for(let y=BED_MIN;y<=BED_MIN+2;y++)setBlock(x,y,z,30,false);

    for(let y=BED_MIN+3;y<=h;y++){
      const depth=h-y;
      let t;
      if(depth===0)t=sf.top;
      else if(depth<=sf.depth)t=sf.sub;
      else{
        t=3;
        /* 深层花岗岩 / 安山岩夹层 */
        if(y<BED_TOP&&y>BED_MIN+6){
          const band=noise2(x/9+y*.35,z/9,55);
          if(band>.74)t=34;
          else if(band<.12)t=35;
        }
        const ore=oreAt(x,y,z);
        if(ore)t=ore;
        /* 深层换成深板岩（合并进主循环，省掉一次整块重扫） */
        else if(y<BED_TOP&&t===3&&hash3(x,y,z,181)<.72)t=92;
      }
      /* 洞穴：水底附近不掏空，避免海水漏空 */
      if(y>BED_MIN+4&&y<h-1&&caveAt(x,y,z)&&!(underwater&&y>SEA-6)){
        t=(y<BED_MIN+12)?48:0;
      }
      /* 洞穴深处零星萤石 */
      if(t===0&&y<-16&&hash3(x,y,z,303)<.012)t=32;
      if(t)setBlock(x,y,z,t,false);
    }

    /* 海 / 河 / 湖 */
    for(let y=h+1;y<=SEA;y++)setBlock(x,y,z,7,false);
  }
  generating=false;
}

/* ---------------- 下界区块生成 ---------------- */
function generateNetherChunk(cx,cz){
  const x0=cx*CS,z0=cz*CS;
  generating=true;
  for(let lx=0;lx<CS;lx++)for(let lz=0;lz<CS;lz++){
    const x=x0+lx,z=z0+lz;
    for(let y=BED_MIN;y<=BED_MIN+2;y++)setBlock(x,y,z,30,false);
    for(let y=WH_MAX-3;y<WH_MAX;y++)setBlock(x,y,z,30,false);
    for(let y=BED_MIN+3;y<WH_MAX-3;y++){
      const n1=noise2(x/10+y*.3,z/10-y*.3,71);
      const n2=noise2(x/6-y*.4,z/6+y*.4,72);
      if(n1>.55&&n2>.3)continue;
      let t=38;
      if(y<BED_MIN+7&&noise2(x/7,z/7,91)>.7)t=39;
      else if(noise2(x/13,z/13,81)>.79)t=41;
      setBlock(x,y,z,t,false);
    }
    for(let y=BED_MIN+3;y<BED_MIN+10;y++)
      if(hash3(x,y,z,311)<.33)setBlock(x,y,z,48,false);
    for(let y=WH_MAX-8;y<WH_MAX-3;y++)
      if(hash3(x,y,z,312)<.40)setBlock(x,y,z,48,false);
  }
  generating=false;
}
function ensureChunk(cx,cz){
  const k=chunkKey(cx,cz);
  if(GENERATED[currentDim].has(k))return;
  GENERATED[currentDim].add(k);
  if(currentDim==="nether")generateNetherChunk(cx,cz);
  else generateOverworldChunk(cx,cz);

  for(const [ek,type] of EDITS[currentDim]){
    const p=ek.split(",").map(Number);
    const x=p[0],y=p[1],z=p[2];
    if(x>=cx*CS&&x<(cx+1)*CS&&z>=cz*CS&&z<(cz+1)*CS)
      setBlock(x,y,z,type||0,false);
  }
}

  const c=base.match(/\w\w/g).map(v=>parseInt(v,16));

  return `rgb(${clamp(c[0]*f,0,255)|0},${clamp(c[1]*f,0,255)|0},${clamp(c[2]*f,0,255)|0})`;
}

const TEXTURES=Object.keys(TEXTURE_FUNCTIONS);
const TILE=16,ATLAS_COLS=8;
let atlasTexture=null;
let tileUV={};

/* 每种贴图只渲染一次并缓存成小画布；重建图集时只做 drawImage，
   而不是每张图 256 次 fillRect（扩建贴图时能省下大量启动时间） */
const tileCanvasCache=new Map();
function tileCanvas(name){
  if(tileCanvasCache.has(name))return tileCanvasCache.get(name);
  const fn=TEXTURE_FUNCTIONS[name];
  const c=document.createElement("canvas");
  c.width=c.height=TILE;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=false;
  if(typeof fn==="function"){
    for(let y=0;y<TILE;y++)for(let x=0;x<TILE;x++){
      g.fillStyle=fn(x,y);
      g.fillRect(x,y,1,1);
    }
  }else{
    g.fillStyle="#888";
    g.fillRect(0,0,TILE,TILE);
  }
  tileCanvasCache.set(name,c);
  return c;
}
let atlasSignature="";
/* 每张贴图外面留一圈“外扩边”：把边缘像素复制到 padding 里，
   这样 mipmap 降采样时采样到的是同一张贴图的颜色，不会混进邻居贴图的透明像素 */
const TILE_PAD=2;
const CELL=TILE+TILE_PAD*2;

function buildAtlas(){
  /* 贴图集合没变就不重复重建 */
  const sig=TEXTURES.length+":"+TEXTURES.join(",");
  if(sig===atlasSignature&&atlasTexture)return;
  atlasSignature=sig;

  const rows=Math.ceil(TEXTURES.length/ATLAS_COLS);
  /* 高度补齐到 2 的幂：非 2 次幂 + mipmap 在部分显卡上会采样失败 */
  const potRows=Math.max(1,2**Math.ceil(Math.log2(Math.max(1,rows))));
  const canvas=document.createElement("canvas");
  canvas.width=ATLAS_COLS*CELL;
  canvas.height=potRows*CELL;
  const ctx=canvas.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  TEXTURES.forEach((name,index)=>{
    const col=index%ATLAS_COLS,row=Math.floor(index/ATLAS_COLS);
    const src=tileCanvas(name);
    const dx=col*CELL+TILE_PAD,dy=row*CELL+TILE_PAD;
    ctx.drawImage(src,dx,dy);
    /* 上下左右各外扩一圈，再补四个角 */
    ctx.drawImage(src,0,0,TILE,1, dx,dy-TILE_PAD,TILE,TILE_PAD);
    ctx.drawImage(src,0,TILE-1,TILE,1, dx,dy+TILE,TILE,TILE_PAD);
    ctx.drawImage(src,0,0,1,TILE, dx-TILE_PAD,dy,TILE_PAD,TILE);
    ctx.drawImage(src,TILE-1,0,1,TILE, dx+TILE,dy,TILE_PAD,TILE);
    ctx.drawImage(src,0,0,1,1, dx-TILE_PAD,dy-TILE_PAD,TILE_PAD,TILE_PAD);
    ctx.drawImage(src,TILE-1,0,1,1, dx+TILE,dy-TILE_PAD,TILE_PAD,TILE_PAD);
    ctx.drawImage(src,0,TILE-1,1,1, dx-TILE_PAD,dy+TILE,TILE_PAD,TILE_PAD);
    ctx.drawImage(src,TILE-1,TILE-1,1,1, dx+TILE,dy+TILE,TILE_PAD,TILE_PAD);

    tileUV[name]={
      u0:dx/canvas.width,
      u1:(dx+TILE)/canvas.width,
      v0:1-(dy+TILE)/canvas.height,
      v1:1-dy/canvas.height
    };
  });

  const tex=new THREE.CanvasTexture(canvas);
  /* 近处保持像素锐利，远处靠 mipmap 消闪烁（外扩边已经隔绝了贴图串色） */
  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps=true;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  atlasTexture=tex;
}

function isTransparentBlock(type){
  if(!type)return true;
  const d=BK[type];
  return !!(d&&d.tr);
}
function buildChunk(cx,cz){
  const k=chunkKey(cx,cz);
  const old=chunkMeshes.get(k);
  if(old){
    scene.remove(old);
    old.geometry.dispose();
    chunkMeshes.delete(k);
  }
  const oldWater=waterMeshes.get(k);
  if(oldWater){
    scene.remove(oldWater);
    oldWater.geometry.dispose();
    waterMeshes.delete(k);
  }

  const positions=[],normals=[],uvs=[],colors=[],indices=[];
  const waterPositions=[],waterNormals=[],waterUVs=[],waterIndices=[];
  const x0=cx*CS,z0=cz*CS;
  let vertex=0,waterVertex=0;

  for(let lx=0;lx<CS;lx++)for(let lz=0;lz<CS;lz++){
    const x=x0+lx,z=z0+lz;
    for(let y=WH_MIN;y<WH_MAX;y++){
      const type=getBlock(x,y,z);
      if(!type)continue;
      const def=BK[type];
      if(!def)continue;

      if(type===7||type===48){
        for(const face of FACES){
          const nx=x+face.n[0],ny=y+face.n[1],nz=z+face.n[2];
          const neighbor=getBlock(nx,ny,nz);
          if(neighbor===type)continue;
          if(!isTransparentBlock(neighbor)&&neighbor!==0)continue;
          if(type===48&&face.n[1]!==1&&neighbor===0)continue;
          const base=waterVertex;
          for(let i=0;i<4;i++){
            const vv=face.v[i];
            waterPositions.push(x+vv[0],y+vv[1],z+vv[2]);
            waterNormals.push(face.n[0],face.n[1],face.n[2]);
            const uv=FACE_UV[i];
            waterUVs.push(uv[0],uv[1]);
          }
          waterIndices.push(base,base+1,base+2,base,base+2,base+3);
          waterVertex+=4;
        }
        continue;
      }

      for(const face of FACES){
        const nx=x+face.n[0],ny=y+face.n[1],nz=z+face.n[2];
        const neighbor=getBlock(nx,ny,nz);
        if(neighbor===type&&isTransparentBlock(type))continue;
        if(neighbor&&!isTransparentBlock(neighbor))continue;
        if(def.tr&&neighbor===type)continue;

        const texName=def.t[face.face]||def.t[0];
        const uvRect=tileUV[texName]||tileUV.stone;
        const base=vertex;

        for(let i=0;i<4;i++){
          const vv=face.v[i];
          positions.push(x+vv[0],y+vv[1],z+vv[2]);
          normals.push(face.n[0],face.n[1],face.n[2]);
          const uv=FACE_UV[i];
          uvs.push(
            uvRect.u0+(uvRect.u1-uvRect.u0)*uv[0],
            uvRect.v0+(uvRect.v1-uvRect.v0)*uv[1]
          );
          colors.push(face.sh,face.sh,face.sh);
        }
        indices.push(base,base+1,base+2,base,base+2,base+3);
        vertex+=4;
      }
    }
  }

  if(vertex){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
    geo.setAttribute("normal",new THREE.Float32BufferAttribute(normals,3));
    geo.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
    geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
    geo.setIndex(indices);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,blockMaterial);
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    scene.add(mesh);
    chunkMeshes.set(k,mesh);
  }

  if(waterVertex){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute("position",new THREE.Float32BufferAttribute(waterPositions,3));
    geo.setAttribute("normal",new THREE.Float32BufferAttribute(waterNormals,3));
    const waterTile=tileUV.water;
    const adjusted=[];
    for(let i=0;i<waterUVs.length;i+=2){
      adjusted.push(waterTile.u0+(waterTile.u1-waterTile.u0)*waterUVs[i]);
      adjusted.push(waterTile.v0+(waterTile.v1-waterTile.v0)*waterUVs[i+1]);
    }
    geo.setAttribute("uv",new THREE.Float32BufferAttribute(adjusted,2));
    geo.setIndex(waterIndices);
    geo.computeBoundingSphere();
    const mesh=new THREE.Mesh(geo,waterMaterial);
    mesh.renderOrder=2;
    scene.add(mesh);
    waterMeshes.set(k,mesh);
  }

  loadedChunks.add(k);
  rebuildGlows(cx,cz);
}
function refreshChunkAt(x,z){
  const cx=Math.floor(x/CS),cz=Math.floor(z/CS);
  const lx=x-cx*CS,lz=z-cz*CS;
  const rebuild=(a,b)=>{
    if(loadedChunks.has(chunkKey(a,b)))buildChunk(a,b);
  };
  rebuild(cx,cz);
  if(lx===0)rebuild(cx-1,cz);
  if(lx===CS-1)rebuild(cx+1,cz);
  if(lz===0)rebuild(cx,cz-1);
  if(lz===CS-1)rebuild(cx,cz+1);
}
function unloadChunk(cx,cz){
  const k=chunkKey(cx,cz);
  const mesh=chunkMeshes.get(k);
  if(mesh){scene.remove(mesh);mesh.geometry.dispose();chunkMeshes.delete(k);}
  const water=waterMeshes.get(k);
  if(water){scene.remove(water);water.geometry.dispose();waterMeshes.delete(k);}
  clearGlows(cx,cz);
  loadedChunks.delete(k);
}
function resetChunkCaches(){
  for(const mesh of chunkMeshes.values()){scene.remove(mesh);mesh.geometry.dispose();}
  for(const mesh of waterMeshes.values()){scene.remove(mesh);mesh.geometry.dispose();}
  for(const sprite of glowSprites.values()){scene.remove(sprite);sprite.material.dispose();}
  chunkMeshes.clear();
  waterMeshes.clear();
  glowSprites.clear();
  loadedChunks.clear();
  pendingMesh.length=0;
  lastPlayerChunk={x:9999,z:9999};
}
/* ---------------- 区块流式加载 ---------------- */
const CHUNK_BUDGET_MS=6;        // 进入游戏后每帧最多花在区块上的时间
const PRIME_BUDGET_MS=26;       // 加载界面期间可以多花一点
let worldLoading=false;         // 是否处于“首次进入世界”的加载阶段
let loadBuilt=0,loadTotal=0;
let pendingPointerLock=false;
const pendingMesh=[];        /* 已生成数据、等待构建网格的区块 */

function chunkNeeded(pcx,pcz){
  const list=[];
  for(let dx=-RENDER_RADIUS;dx<=RENDER_RADIUS;dx++){
    for(let dz=-RENDER_RADIUS;dz<=RENDER_RADIUS;dz++){
      list.push({cx:pcx+dx,cz:pcz+dz,distance:Math.abs(dx)+Math.abs(dz)});
    }
  }
  list.sort((a,b)=>a.distance-b.distance);
  return list;
}
function updateChunks(force=false){
  const pcx=Math.floor(player.pos.x/CS);
  const pcz=Math.floor(player.pos.z/CS);
  const moved=force||pcx!==lastPlayerChunk.x||pcz!==lastPlayerChunk.z;

  if(moved){
    lastPlayerChunk={x:pcx,z:pcz};
    for(const key of [...loadedChunks]){
      const [cx,cz]=key.split(",").map(Number);
      if(Math.abs(cx-pcx)>UNLOAD_RADIUS||Math.abs(cz-pcz)>UNLOAD_RADIUS)unloadChunk(cx,cz);
    }
    loadBuilt=0;
    loadTotal=0;
  }

  const needed=chunkNeeded(pcx,pcz);
  for(const item of needed){
    if(!loadedChunks.has(chunkKey(item.cx,item.cz)))loadTotal++;
  }
  if(!loadTotal)loadTotal=needed.length;

  /* 时间预算：加载界面期间宽松，正常游戏时严格，避免卡顿 */
  const budget=worldLoading?PRIME_BUDGET_MS:CHUNK_BUDGET_MS;
  const t0=performance.now();
  let built=0;

  /* 正常游戏时把“生成数据”和“构建网格”拆到两帧，
     这样每帧最多只花其中一半的时间，走动时不至于明显掉帧 */
  if(!worldLoading&&pendingMesh.length){
    const p=pendingMesh.shift();
    if(!loadedChunks.has(chunkKey(p.cx,p.cz)))buildChunk(p.cx,p.cz);
    loadBuilt++;
    return;
  }

  for(const item of needed){
    ensureChunk(item.cx,item.cz);
    const key=chunkKey(item.cx,item.cz);
    if(!loadedChunks.has(key)){
      if(worldLoading){
        buildChunk(item.cx,item.cz);
      }else if(pendingMesh.length<3){
        pendingMesh.push({cx:item.cx,cz:item.cz});
        break;                     /* 每帧只生成一个区块的数据 */
      }
      built++;
      if(performance.now()-t0>=budget)break;
    }
  }
  loadBuilt+=built;
}

function ensureLoadOverlay(){

    '<div id="loadFill" style="height:100%;width:0;background:linear-gradient(#6fc3ff,#2f7fd0);transition:width .1s"></div></div>'+
    '<div id="loadText" style="margin-top:12px;font-size:12px;color:#8fb6d8">准备中……</div>'+
    '<div id="loadSeed" style="margin-top:6px;font-size:11px;color:#5f7d99"></div>';
  document.body.appendChild(loadOverlay);
  return loadOverlay;
}
function beginWorldLoading(msg){
  worldLoading=true;
  loadBuilt=0;
  loadTotal=0;
  pendingPointerLock=true;
  const ov=ensureLoadOverlay();
  const t=$("loadText");
  if(t)t.textContent=msg||"准备中……";
  const s=$("loadSeed");
  if(s)s.textContent=seedLabel();
  const f=$("loadFill");
  if(f)f.style.width="0%";
  ov.style.display="flex";
}
function updateLoadingUI(){
  if(!worldLoading)return;
  const ov=loadOverlay;
  const need=Math.max(1,loadTotal);
  const done=Math.max(0,need-loadPendingCount());
  const pct=clamp(done/need*100,0,100);
  const f=$("loadFill");
  if(f)f.style.width=pct.toFixed(0)+"%";
  const t=$("loadText");
  if(t)t.textContent="生成地形 "+pct.toFixed(0)+"%　("+done+"/"+need+" 区块)";
  if(loadPendingCount()===0)endWorldLoading();
}
function loadPendingCount(){
  const pcx=Math.floor(player.pos.x/CS);
  const pcz=Math.floor(player.pos.z/CS);
  let n=0;
  for(const item of chunkNeeded(pcx,pcz)){
    if(!loadedChunks.has(chunkKey(item.cx,item.cz)))n++;
  }
  return n;
}
function endWorldLoading(){
  worldLoading=false;
  if(loadOverlay)loadOverlay.style.display="none";
  loadPendingCount();
  if(pendingPointerLock){
    pendingPointerLock=false;
    setTimeout(()=>{if(started&&!uiOpen&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();},30);
  }
}

const glowCanvas=document.createElement("canvas");
glowCanvas.width=glowCanvas.height=64;
const glowCtx=glowCanvas.getContext("2d");
const glowGradient=glowCtx.createRadialGradient(32,32,0,32,32,32);
glowGradient.addColorStop(0,"rgba(255,225,145,.95)");

const glowTexture=new THREE.CanvasTexture(glowCanvas);

function rebuildGlows(cx,cz){
  clearGlows(cx,cz);
  const x0=cx*CS,z0=cz*CS;
  for(let lx=0;lx<CS;lx++)for(let lz=0;lz<CS;lz++){
    const x=x0+lx,z=z0+lz;
    for(let y=WH_MIN;y<WH_MAX;y++){
      if(getBlock(x,y,z)!==32&&getBlock(x,y,z)!==50)continue;
      const k=key3(x,y,z);
      if(glowSprites.has(k))continue;
      const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
        map:glowTexture,transparent:true,opacity:.82,
        blending:THREE.AdditiveBlending,depthWrite:false
      }));
      sprite.position.set(x+.5,y+.65,z+.5);
      sprite.scale.set(2.6,2.6,1);
      scene.add(sprite);
      glowSprites.set(k,sprite);
    }
  }
}
function clearGlows(cx,cz){
  const x0=cx*CS,z0=cz*CS;
  for(const [k,sprite] of glowSprites){
    const p=k.split(",").map(Number);
    if(p[0]>=x0&&p[0]<x0+CS&&p[2]>=z0&&p[2]<z0+CS){
      scene.remove(sprite);
      sprite.material.dispose();
      glowSprites.delete(k);
    }
  }
}

function tileDataURL(name){
  if(tileDataURL.cache===undefined)tileDataURL.cache=new Map();
  if(tileDataURL.cache.has(name))return tileDataURL.cache.get(name);
  const src=atlasTexture&&atlasTexture.image;
  const idx=TEXTURES.indexOf(name);
  const c=document.createElement("canvas");
  c.width=c.height=TILE;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=false;
  if(src&&idx>=0){
    const col=idx%ATLAS_COLS,row=Math.floor(idx/ATLAS_COLS);
    /* 图集每格带外扩边，取图时要跳到内圈 */
    g.drawImage(src,col*CELL+TILE_PAD,row*CELL+TILE_PAD,TILE,TILE,0,0,TILE,TILE);
  }else{
    g.fillStyle="#888";
    g.fillRect(0,0,TILE,TILE);
  }
  const url=c.toDataURL();
  tileDataURL.cache.set(name,url);
  return url;
}

function giveItem(id,count){
  if(!IT[id])return false;
  count=count||1;
  const lists=[hotbar,inventory];
  for(const list of lists){
    for(let i=0;i<list.length;i++){
      const s=list[i];
      if(s&&s.id===id&&s.count<64){
        const add=Math.min(count,64-s.count);
        s.count+=add;
        count-=add;
        if(count<=0){renderHotbar();renderInventory();return true;}
      }
    }
  }
  for(const list of lists){
    for(let i=0;i<list.length;i++){
      if(!list[i]){
        const add=Math.min(count,64);
        list[i]={id,count:add};
        count-=add;
        if(count<=0){renderHotbar();renderInventory();return true;}
      }
    }
  }
  renderHotbar();
  renderInventory();
  return count<=0;
}

function trimGrid(rows,cols,get){
  let minr=rows,maxr=-1,minc=cols,maxc=-1;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(get(r,c)){
      if(r<minr)minr=r;
      if(r>maxr)maxr=r;
      if(c<minc)minc=c;
      if(c>maxc)maxc=c;
    }
  }
  if(maxr<0)return null;
  const out=[];
  for(let r=minr;r<=maxr;r++){
    const row=[];
    for(let c=minc;c<=maxc;c++)row.push(get(r,c));
    out.push(row);
  }
  return out;
}
function matchRecipe(){
  const cur=trimGrid(3,3,(r,c)=>{
    const s=craftGrid[r*3+c];
    return s?s.id:null;
  });
  if(!cur)return null;
  for(const rec of RECIPES){
    const pat=trimGrid(3,3,(r,c)=>rec.p[r][c]);
    if(!pat)continue;
    if(pat.length!==cur.length)continue;
    let ok=true;
    for(let r=0;r<pat.length&&ok;r++){
      if(pat[r].length!==cur[r].length){ok=false;break;}
      for(let c=0;c<pat[r].length;c++){
        if(pat[r][c]!==cur[r][c]){ok=false;break;}
      }
    }
    if(ok)return rec;
  }
  return null;
}

  const rec=matchRecipe();

  if(hint){
    hint.textContent=rec?("→ "+itemName(rec.o[0])+" × "+rec.o[1]+"（点击右侧取走）"):"摆放材料以合成（木/石/铁/钻石工具、打火石、下界合金）";
  }
}

/* ---------------- 碰撞与地形查询 ---------------- */
function isSolidAt(x,y,z){
  const t=getBlock(x,y,z);
  if(!t)return false;
  if(t===7||t===48||t===54)return false;
  return true;
}
function playerCollides(px,py,pz){
  const x0=Math.floor(px-PLAYER_HALF+1e-4),x1=Math.floor(px+PLAYER_HALF-1e-4);
  const y0=Math.floor(py+1e-4),y1=Math.floor(py+PLAYER_HEIGHT-1e-4);
  const z0=Math.floor(pz-PLAYER_HALF+1e-4),z1=Math.floor(pz+PLAYER_HALF-1e-4);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
    if(isSolidAt(x,y,z))return true;
  }
  return false;
}
function surfaceY(x,z,fromY){
  const fx=Math.floor(x),fz=Math.floor(z);
  for(let y=Math.floor(fromY);y>BED_MIN-2;y--){
    if(isSolidAt(fx,y,fz)&&!isSolidAt(fx,y+1,fz)&&!isSolidAt(fx,y+2,fz))return y+1;
  }
  return null;
}
function blockIntersectsPlayer(x,y,z){
  return x+1>player.pos.x-PLAYER_HALF&&x<player.pos.x+PLAYER_HALF&&
         y+1>player.pos.y&&y<player.pos.y+PLAYER_HEIGHT&&
         z+1>player.pos.z-PLAYER_HALF&&z<player.pos.z+PLAYER_HALF;
}

const highlight=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004,1.004,1.004)),
  new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.6})
);
highlight.visible=false;
scene.add(highlight);

let target=null;
function rayDir(){
  return new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,"YXZ"));
}
function raycastVoxel(maxDist){
  const dir=rayDir();
  const ox=player.pos.x,oy=player.pos.y+EYE,oz=player.pos.z;
  let last={x:Math.floor(ox),y:Math.floor(oy),z:Math.floor(oz)};
  const step=0.03;
  for(let d=0;d<maxDist;d+=step){
    const x=Math.floor(ox+dir.x*d),y=Math.floor(oy+dir.y*d),z=Math.floor(oz+dir.z*d);
    if(x===last.x&&y===last.y&&z===last.z)continue;
    const t=getBlock(x,y,z);
    if(t&&t!==7&&t!==48&&t!==54){
      return {x,y,z,block:t,normal:{x:last.x-x,y:last.y-y,z:last.z-z}};
    }
    last={x,y,z};
  }
  return null;
}
function updateTarget(){
  target=raycastVoxel(6);
  if(target){
    highlight.visible=true;
    highlight.position.set(target.x+.5,target.y+.5,target.z+.5);
  }else{
    highlight.visible=false;
  }
}

/* ---------------- 粒子 ---------------- */
const particles=[];
function spawnParticles(x,y,z,color,count){
  for(let i=0;i<count;i++){
    const mesh=new THREE.Mesh(
      new THREE.BoxGeometry(.12,.12,.12),
      new THREE.MeshBasicMaterial({color})
    );
    mesh.position.set(
      x+(Math.random()-.5)*.7,
      y+(Math.random()-.5)*.7,
      z+(Math.random()-.5)*.7
    );
    particleGroup.add(mesh);
    particles.push({
      mesh,
      vel:new THREE.Vector3((Math.random()-.5)*3.4,Math.random()*3.6,(Math.random()-.5)*3.4),
      life:.55+Math.random()*.45
    });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){
      particleGroup.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i,1);
      continue;
    }
    p.vel.y-=22*dt;
    p.mesh.position.addScaledVector(p.vel,dt);
    p.mesh.scale.setScalar(Math.max(.15,p.life));
  }
}

/* ---------------- 掉落物 ---------------- */
const drops=[];
function itemColor(id){
  const def=IT[id];
  if(def&&def.block&&BK[def.block]){
    const type=def.block;
    if(type===3||type===10)return 0x888888;
    if(type===1||type===2||type===4)return 0x8a603c;
    if(type===5)return 0x347a34;
    if(type===6)return 0xdfd19a;
    if(type===15)return 0x241b2e;
    if(type===26||type===45)return 0x43dedb;
    if(type===25||type===46)return 0xe8bd38;
    if(type===24||type===47)return 0xd4d4dc;
    return 0xb08a55;
  }
  if(id==="diamond"||id==="emerald")return 0x43dedb;
  if(id==="gold_ingot")return 0xf0c94b;
  if(id==="iron_ingot")return 0xd4d4dc;
  if(id==="coal"||id==="charcoal")return 0x2a2a2a;
  if(id==="redstone")return 0xe62c2c;
  if(id==="lapis")return 0x285bd0;
  return 0xdddddd;
}
function spawnDrop(id,x,y,z,count){
  if(!IT[id])return;
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(.26,.26,.26),
    new THREE.MeshStandardMaterial({color:itemColor(id),roughness:.6,metalness:.15})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  dropGroup.add(mesh);
  drops.push({id,count:count||1,mesh,vel:new THREE.Vector3((Math.random()-.5)*1.2,2.6,(Math.random()-.5)*1.2),life:60,spin:Math.random()*6});
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.life-=dt;
    d.spin+=dt*2.4;
    d.vel.y-=20*dt;
    d.mesh.position.addScaledVector(d.vel,dt);
    const bx=Math.floor(d.mesh.position.x),by=Math.floor(d.mesh.position.y),bz=Math.floor(d.mesh.position.z);
    if(isSolidAt(bx,by,bz)){
      d.mesh.position.y=by+1.02;
      d.vel.set(0,0,0);
    }
    d.mesh.rotation.y=d.spin;

    const dx=d.mesh.position.x-player.pos.x;
    const dy=d.mesh.position.y-(player.pos.y+0.8);
    const dz=d.mesh.position.z-player.pos.z;
    const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dist<1.7){
      if(giveItem(d.id,d.count)){
        toast("+ "+itemName(d.id)+(d.count>1?" × "+d.count:""));
        dropGroup.remove(d.mesh);
        d.mesh.geometry.dispose();
        d.mesh.material.dispose();
        drops.splice(i,1);
        continue;
      }
    }
    if(d.life<=0){
      dropGroup.remove(d.mesh);
      d.mesh.geometry.dispose();
      d.mesh.material.dispose();
      drops.splice(i,1);
    }
  }
}
function clearDrops(){
  for(const d of drops){
    dropGroup.remove(d.mesh);
    d.mesh.geometry.dispose();
    d.mesh.material.dispose();
  }
  drops.length=0;
}

let mining=false;

function breakBlock(x,y,z,type){

function tryPlace(){
  if(!target)return;
  const item=selectedItem();
  if(item&&IT[item.id]&&!IT[item.id].block){
    if(item.id==="flint_and_steel"&&target.block===15){
      if(tryCreatePortal(target.x,target.y,target.z))return;
    }
    if(IT[item.id].food&&player.food<20){
      player.food=Math.min(20,player.food+IT[item.id].food);
      player.health=Math.min(20,player.health+1);
      consumeSelected(1);
      renderStats();
      toast("恢复饱食度");
      return;
    }
  }
  if(target.block===36){
    openChest(target.x,target.y,target.z);
    return;
  }
  if(!item)return;
  const def=IT[item.id];
  if(!def.block)return;
  const px=target.x+target.normal.x;
  const py=target.y+target.normal.y;
  const pz=target.z+target.normal.z;
  if(py<WH_MIN||py>=WH_MAX)return;
  const cur=getBlock(px,py,pz);
  if(cur!==0&&cur!==7&&cur!==48)return;
  if(blockIntersectsPlayer(px,py,pz))return;
  setBlock(px,py,pz,def.block,true);
  refreshChunkAt(px,pz);
  spawnParticles(px+.5,py+.5,pz+.5,itemColor(item.id),4);
  if(player.mode!=="creative")consumeSelected(1);
}
function updateMining(dt){
  if(!mining||!target){
    breakProgress=0;
    miningKey="";
    return;
  }
  const k=key3(target.x,target.y,target.z);
  if(k!==miningKey){
    miningKey=k;
    breakProgress=0;
  }
  const def=BK[target.block];
  const hard=Math.max(.06,(def&&def.hard)||1);
  if(player.mode==="creative"){
    breakBlock(target.x,target.y,target.z,target.block);
    breakProgress=0;
    mining=false;
    return;
  }
  breakProgress+=dt/hard;
  miningFx-=dt;
  if(miningFx<=0){
    miningFx=.12;
    spawnParticles(target.x+.5,target.y+.5,target.z+.5,itemColor(DROP[target.block]||"coal"),2);
  }
  if(breakProgress>=1){
    breakBlock(target.x,target.y,target.z,target.block);
    breakProgress=0;
    miningKey="";
  }
}

/* ---------------- 下界传送门 ---------------- */
function tryCreatePortal(px,py,pz){
  const axes=["x","z"];
  for(const axis of axes){
    for(let i0=0;i0<4;i0++){
      for(let j0=0;j0<5;j0++){
        const bx=axis==="x"?px:px-i0;
        const bz=axis==="x"?pz-i0:pz;
        const by=py-j0;
        let ok=true;
        const inner=[];
        for(let i=0;i<4&&ok;i++){
          for(let j=0;j<5&&ok;j++){
            const ux=axis==="x"?bx:bx+i;
            const uz=axis==="x"?bz+i:bz;
            const yy=by+j;
            const border=(i===0||i===3||j===0||j===4);
            const t=getBlock(ux,yy,uz);
            if(border){
              if(t!==15)ok=false;
            }else{
              if(t!==0&&t!==54)ok=false;
              else inner.push([ux,yy,uz]);
            }
          }
        }
        if(ok&&inner.length===6){
          for(const p of inner)setBlock(p[0],p[1],p[2],54,true);
          for(const p of inner)refreshChunkAt(p[0],p[2]);
          spawnParticles(px+.5,py+.5,pz+.5,0xa044dd,24);
          toast("🔥 传送门已点燃（站进去 1 秒进入下界）");
          return true;
        }
      }
    }
  }
  toast("传送门需要 4×5 的黑曜石边框");
  return false;
}
function buildPortalAt(x,y,z){
  for(let i=0;i<4;i++){
    for(let j=0;j<5;j++){
      const border=(i===0||i===3||j===0||j===4);
      setBlock(x+i,y+j,z,border?15:54,true);
    }
  }
  for(let i=0;i<4;i++)refreshChunkAt(x+i,z);
}
function switchDimension(){
  const from=currentDim;
  currentDim=from==="overworld"?"nether":"overworld";
  const scale=currentDim==="nether"?1/8:8;
  const tx=clamp(player.pos.x*scale,-20000,20000);
  const tz=clamp(player.pos.z*scale,-20000,20000);
  const cx=Math.floor(tx/CS),cz=Math.floor(tz/CS);
  ensureChunk(cx,cz);
  let y=surfaceY(tx,tz,currentDim==="nether"?WH_MAX-8:WH_MAX-4);
  if(y===null)y=currentDim==="nether"?-10:SEA+2;
  const px=Math.floor(tx)-2,pz=Math.floor(tz);
  buildPortalAt(px,y,pz);
  for(let i=0;i<2;i++){
    setBlock(px+1+i,y+1,pz+1,0,true);
    setBlock(px+1+i,y+2,pz+1,0,true);
  }
  player.pos.set(px+1.5,y+1.1,pz+2.4);
  player.vel.set(0,0,0);
  player.portalTimer=0;
  player.portalCD=6;
  clearMobs();
  clearDrops();
  resetChunkCaches();
  updateChunks(true);
  toast(currentDim==="nether"?"已进入下界":"已返回主世界");
  renderStats();
}
function updatePortal(dt){
  if(player.portalCD>0){
    player.portalCD-=dt;
    return;
  }
  const inside=getBlock(
    Math.floor(player.pos.x),
    Math.floor(player.pos.y+1),
    Math.floor(player.pos.z)
  )===54;
  if(inside){
    player.portalTimer+=dt;
    if(player.portalTimer>1){
      player.portalTimer=0;
      switchDimension();
    }
  }else{
    player.portalTimer=0;
  }
}

/* ---------------- 生物 ---------------- */
const MOB_DEF={
  creeper:{name:"苦力怕",color:0x3f9b46,head:0x2f7c35,hp:12,speed:2.9,dmg:6},
  piglin:{name:"猪灵",color:0xd9a08a,head:0xc98a74,hp:16,speed:3.3,dmg:4},
  blaze:{name:"烈焰人",color:0xf4c542,head:0xffe066,hp:14,speed:2.1,dmg:3,ranged:true}
};
const mobs=[];
const fireballs=[];

/* ---------------- 生物建模：方块风格，脚底对齐 y=0，朝 +Z ---------------- */
function mobMat(color,roughness){
  return new THREE.MeshStandardMaterial({color,roughness:roughness===undefined?.9:roughness});
}
function mobBox(w,h,d){return new THREE.BoxGeometry(w,h,d);}
function mobPart(parent,geo,mat,x,y,z){
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}
function mobPivot(parent,x,y,z){
  const p=new THREE.Group();
  p.position.set(x,y,z);
  parent.add(p);
  return p;
}

/* 人形：僵尸 / 骷髅 / 猪灵 / 村民 / 末影人 / 铁傀儡 */
function buildHumanoid(g,def,o){
  o=o||{};
  const s=o.scale||1;
  const skin=mobMat(def.color,.86);
  const headMat=mobMat(def.head,.86);
  const cloth=mobMat(o.cloth!==undefined?o.cloth:0x3f5f8f,.95);
  const pants=mobMat(o.pants!==undefined?o.pants:0x2a3350,.95);
  const limbMat=o.limbMat!==undefined?mobMat(o.limbMat,.9):skin;
  const shoe=mobMat(o.shoe!==undefined?o.shoe:0x2b2b2b,.9);
  const limbs={legs:[],arms:[],head:null,body:null,neck:null};

  const thigh=.72*s, armLen=(o.armLen||.62)*s;
  for(const side of [-1,1]){
    const hip=mobPivot(g,side*.13*s,.74*s,0);
    mobPart(hip,mobBox(.2*s,thigh,.22*s),pants,0,-thigh/2,0);
    mobPart(hip,mobBox(.21*s,.1*s,.26*s),shoe,0,-thigh+.04*s,.02*s);
    limbs.legs.push(hip);
  }
  limbs.body=mobPart(g,mobBox(.5*s,.64*s,.28*s),cloth,0,1.06*s,0);
  mobPart(g,mobBox(.54*s,.08*s,.3*s),cloth,0,1.36*s,0);
  for(const side of [-1,1]){
    const shoulder=mobPivot(g,side*.33*s,1.31*s,0);
    mobPart(shoulder,mobBox(.17*s,armLen,.19*s),limbMat,0,-armLen/2,0);
    if(!o.noHands)mobPart(shoulder,mobBox(.18*s,.12*s,.2*s),skin,0,-armLen+.04*s,0);
    shoulder.userData.baseRot=o.armsForward?-1.25:0;
    shoulder.rotation.x=shoulder.userData.baseRot;
    limbs.arms.push(shoulder);
  }
  const neck=mobPivot(g,0,1.4*s,0);
  mobPart(neck,mobBox(.16*s,.1*s,.16*s),skin,0,.02*s,0);
  const head=mobPivot(neck,0,.06*s,0);
  mobPart(head,mobBox(.46*s,.44*s,.46*s),headMat,0,.22*s,0);
  limbs.neck=neck;
  limbs.head=head;
  const eyeMat=new THREE.MeshBasicMaterial({color:o.eyeColor!==undefined?o.eyeColor:0x101010});
  mobPart(head,mobBox(.1*s,.09*s,.02*s),eyeMat,-.11*s,.26*s,.235*s);
  mobPart(head,mobBox(.1*s,.09*s,.02*s),eyeMat,.11*s,.26*s,.235*s);
  if(o.nose)mobPart(head,mobBox(.1*s,.18*s,.12*s),mobMat(o.noseColor||def.head,.85),0,.16*s,.28*s);
  if(o.hat)mobPart(head,mobBox(.5*s,.09*s,.5*s),mobMat(o.hat,.9),0,.45*s,0);
  if(o.brow)mobPart(head,mobBox(.34*s,.05*s,.02*s),mobMat(o.brow,.8),0,.33*s,.235*s);
  return limbs;
}

/* 苦力怕：四条短腿 + 身体 + 大方头 */
function buildCreeper(g,def){
  const skin=mobMat(def.color,.95);
  const headMat=mobMat(def.head,.9);
  const limbs={legs:[],arms:[],head:null,body:null};
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const p=mobPivot(g,sx*.16,.3,sz*.16);
    mobPart(p,mobBox(.2,.3,.2),skin,0,-.15,0);
    limbs.legs.push(p);
  }
  limbs.body=mobPart(g,mobBox(.46,.74,.28),skin,0,.68,0);
  mobPart(g,mobBox(.4,.12,.3),mobMat(def.head,.9),0,1.02,0);
  const head=mobPivot(g,0,1.26,0);
  mobPart(head,mobBox(.46,.44,.44),headMat,0,0,0);
  limbs.head=head;
  const dark=new THREE.MeshBasicMaterial({color:0x101010});
  mobPart(head,mobBox(.12,.12,.02),dark,-.1,.08,.225);
  mobPart(head,mobBox(.12,.12,.02),dark,.1,.08,.225);
  mobPart(head,mobBox(.09,.16,.02),dark,-.07,-.1,.225);
  mobPart(head,mobBox(.09,.16,.02),dark,.07,-.1,.225);
  mobPart(head,mobBox(.18,.06,.02),dark,0,-.19,.225);
  return limbs;
}

/* 四足：牛 / 猪 / 羊 */
function buildQuadruped(g,def,o){
  o=o||{};
  const bodyMat=mobMat(o.wool?0xececec:def.color,.92);
  const headMat=mobMat(o.wool?0xf7f7f7:def.head,.88);
  const legMat=mobMat(o.legColor!==undefined?o.legColor:def.color,.9);
  const limbs={legs:[],arms:[],head:null,body:null,neck:null,tail:null};
  limbs.body=mobPart(g,mobBox(.58,.5,.96),bodyMat,0,.78,0);
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const p=mobPivot(g,sx*.21,.52,sz*.34);
    mobPart(p,mobBox(.16,.52,.16),legMat,0,-.26,0);
    mobPart(p,mobBox(.17,.07,.18),mobMat(0x2a2a2a,.9),0,-.5,.01);
    limbs.legs.push(p);
  }
  const neck=mobPivot(g,0,.86,.44);
  const head=mobPivot(neck,0,.1,.1);
  mobPart(head,mobBox(.4,.36,.38),headMat,0,0,0);
  mobPart(head,mobBox(.22,.16,.1),mobMat(o.snout||def.head,.85),0,-.06,.22);
  mobPart(head,mobBox(.16,.1,.02),mobMat(0x2a2020,.9),0,-.05,.272);
  limbs.neck=neck;
  limbs.head=head;
  const eye=new THREE.MeshBasicMaterial({color:0x141414});
  mobPart(head,mobBox(.08,.08,.03),eye,-.12,.1,.196);
  mobPart(head,mobBox(.08,.08,.03),eye,.12,.1,.196);
  if(o.horns){
    const hm=mobMat(0xece8dc,.7);
    mobPart(head,mobBox(.07,.07,.16),hm,-.19,.2,.02);
    mobPart(head,mobBox(.07,.07,.16),hm,.19,.2,.02);
  }
  for(const sx of [-1,1]){
    const ear=mobPivot(head,sx*.2,.16,-.02);
    ear.rotation.z=sx*.5;
    mobPart(ear,mobBox(.1,.06,.06),headMat,0,0,0);
  }
  const tail=mobPivot(g,0,.82,-.5);
  tail.rotation.x=.35;
  mobPart(tail,mobBox(.07,.07,.26),legMat,0,0,-.13);
  limbs.tail=tail;
  if(o.wool)mobPart(g,mobBox(.66,.56,1.02),mobMat(0xf4f4f4,.98),0,.8,0);
  return limbs;
}

/* 蜘蛛：扁平身体 + 八条两段腿 */
function buildSpider(g,def){
  const skin=mobMat(def.color,.95);
  const headMat=mobMat(def.head,.9);
  const limbs={legs:[],arms:[],head:null,body:null};
  limbs.body=mobPart(g,mobBox(.56,.3,.86),skin,0,.42,-.06);
  mobPart(g,mobBox(.46,.1,.6),mobMat(def.head,.9),0,.56,-.06);
  const head=mobPivot(g,0,.4,.44);
  mobPart(head,mobBox(.32,.28,.32),headMat,0,.02,0);
  limbs.head=head;
  const eye=new THREE.MeshBasicMaterial({color:0xd83b3b});
  for(const ex of [-.09,.09]){
    mobPart(head,mobBox(.07,.07,.02),eye,ex,.08,.165);
    mobPart(head,mobBox(.045,.045,.02),eye,ex,-.02,.165);
  }
  for(let i=0;i<4;i++){
    for(const side of [-1,1]){
      const p=mobPivot(g,side*.26,.44,.3-i*.22);
      p.rotation.z=side*.75;
      mobPart(p,mobBox(.4,.07,.07),skin,side*.2,0,0);
      const knee=mobPivot(p,side*.4,0,0);
      knee.rotation.z=side*-1.5;
      mobPart(knee,mobBox(.26,.06,.06),skin,side*.13,-.06,0);
      limbs.legs.push(p);
    }
  }
  return limbs;
}

/* 烈焰人：悬浮的旋转杆状身体 */
function buildBlaze(g,def){
  const coreMat=mobMat(def.color,.55);
  const headMat=mobMat(def.head,.6);
  const limbs={legs:[],arms:[],head:null,body:null,spin:null};
  const spin=mobPivot(g,0,1.0,0);
  limbs.spin=spin;
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const rod=mobPivot(spin,Math.cos(a)*.3,0,Math.sin(a)*.3);
    mobPart(rod,mobBox(.1,.66,.1),coreMat,0,0,0);
    rod.rotation.z=Math.cos(a)*.22;
    rod.rotation.x=Math.sin(a)*.22;
  }
  const head=mobPivot(g,0,1.42,0);
  mobPart(head,mobBox(.44,.42,.44),headMat,0,0,0);
  limbs.head=head;
  const eye=new THREE.MeshBasicMaterial({color:0x20140a});
  mobPart(head,mobBox(.1,.1,.02),eye,-.1,.05,.225);
  mobPart(head,mobBox(.1,.1,.02),eye,.1,.05,.225);
  mobPart(g,mobBox(.22,.22,.22),new THREE.MeshBasicMaterial({color:0xffaa22}),0,1.02,0);
  return limbs;
}

function buildMobModel(type,g,def){
  switch(type){
    case "creeper":return buildCreeper(g,def);
    case "blaze":return buildBlaze(g,def);
    case "spider":return buildSpider(g,def);
    case "cow":return buildQuadruped(g,def,{snout:0xe0b8b8,horns:true,legColor:0x4a3527});
    case "pig":return buildQuadruped(g,def,{snout:0xf0a8b0,legColor:0xdf9ea5});
    case "sheep":return buildQuadruped(g,def,{wool:true,legColor:0xd8d8d8});
    case "zombie":return buildHumanoid(g,def,{cloth:0x3f5f8f,pants:0x2a3350,armsForward:true,eyeColor:0x22331a,shoe:0x24242c});
    case "skeleton":return buildHumanoid(g,def,{cloth:0xcfcfcf,pants:0xcfcfcf,armLen:.66,eyeColor:0x1a1a1a,shoe:0xbdbdbd,noHands:true});
    case "piglin":return buildHumanoid(g,def,{cloth:0x8a6b3a,pants:0x6b4a26,eyeColor:0x2a1a10,nose:true,noseColor:0xc98a74,shoe:0x4a3018});
    case "villager":return buildHumanoid(g,def,{cloth:0x6b4a26,pants:0x4a3018,nose:true,noseColor:0xb08e63,eyeColor:0x2a1a10,shoe:0x3a2412});
    case "enderman":return buildHumanoid(g,def,{cloth:0x1b1024,pants:0x1b1024,limbMat:0x120a1a,armLen:1.1,eyeColor:0xd070ff,shoe:0x120a1a,noHands:true});
    case "iron_golem":return buildHumanoid(g,def,{cloth:0xd8d8cf,pants:0xbfbfb4,limbMat:0xcfcfc6,eyeColor:0x8fc4ff,shoe:0xb0b0a6,brow:0x9aa0a8});
    default:return buildHumanoid(g,def,{});
  }
}
/* 走路 / 待机动画 */
function animateMobModel(m,dt,speed){
  const L=m.limbs;
  if(!L)return;
  const walk=Math.min(1,speed/2.6);
  if(speed>.12)m.walkPhase=(m.walkPhase||0)+dt*(3.4+speed*1.7);
  const swing=Math.sin(m.walkPhase||0)*.7*walk;
  if(L.legs){
    for(let i=0;i<L.legs.length;i++){
      L.legs[i].rotation.x=swing*((i%2===0)?1:-1);
    }
  }
  if(L.arms){
    for(let i=0;i<L.arms.length;i++){
      const base=L.arms[i].userData.baseRot||0;
      L.arms[i].rotation.x=base+swing*((i%2===0)?-.8:.8);
    }
  }
  if(L.head){
    L.head.rotation.y=Math.sin(m.anim*.6)*.18;
    L.head.rotation.x=Math.sin(m.anim*.9)*.04;
  }
  if(L.neck)L.neck.rotation.x=Math.sin(m.anim*1.6)*.03;
  if(L.spin)L.spin.rotation.y=m.anim*2.2;
  if(L.body)L.body.scale.y=1+Math.sin(m.anim*2.6)*.015;
}

function createMob(type,x,y,z){
  const def=MOB_DEF[type]||{name:"生物",color:0x999999,head:0x8a8a8a,hp:10,speed:2,dmg:1};
  const g=new THREE.Group();
  const limbs=buildMobModel(type,g,def);
  g.position.set(x,y,z);
  entityGroup.add(g);
  return {
    type,
    def,
    g,
    limbs,
    hp:def.hp,
    pos:g.position,
    dir:new THREE.Vector3(Math.random()-.5,0,Math.random()-.5).normalize(),
    cd:1,
    fuse:0,
    wander:0,
    anim:Math.random()*6,
    walkPhase:Math.random()*6,
    fireCD:1.5+Math.random()*2,
    hurt:0,
    onGround:false
  };
}
function clearMobs(){
  for(const m of mobs)entityGroup.remove(m.g);
  mobs.length=0;
  for(const f of fireballs){
    entityGroup.remove(f.mesh);
    f.mesh.geometry.dispose();
    f.mesh.material.dispose();
  }
  fireballs.length=0;
}
function killMob(m){
  const idx=mobs.indexOf(m);
  if(idx>=0)mobs.splice(idx,1);
  entityGroup.remove(m.g);
  spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0xff4466,16);
  if(player.mode!=="creative"){
    if(m.type==="piglin")spawnDrop("gold_ingot",m.pos.x,m.pos.y+1,m.pos.z,1);
    else if(m.type==="blaze")spawnDrop("glowstone",m.pos.x,m.pos.y+1,m.pos.z,1);
    else spawnDrop("coal",m.pos.x,m.pos.y+1,m.pos.z,1);
  }
}
function attackMob(){
  const dir=rayDir();
  const eye=new THREE.Vector3(player.pos.x,player.pos.y+EYE,player.pos.z);
  let best=null;
  let bestT=Infinity;
  for(const m of mobs){
    const to=new THREE.Vector3(m.pos.x,m.pos.y+1,m.pos.z).sub(eye);
    const t=to.dot(dir);
    if(t<0||t>4.8)continue;
    const perp=to.addScaledVector(dir,-t).length();
    if(perp<.95&&t<bestT){
      best=m;
      bestT=t;
    }
  }
  if(!best)return false;
  const item=selectedItem();
  const dmg=(item&&IT[item.id]&&IT[item.id].dmg)?IT[item.id].dmg:1;
  best.hp-=dmg;
  best.hurt=.22;
  spawnParticles(best.pos.x,best.pos.y+1,best.pos.z,0xff5566,7);
  if(best.hp<=0)killMob(best);
  return true;
}
function shootFireball(m){
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(.18,8,8),
    new THREE.MeshBasicMaterial({color:0xffaa33})
  );
  mesh.position.set(m.pos.x,m.pos.y+1.6,m.pos.z);
  entityGroup.add(mesh);
  const dir=new THREE.Vector3(
    player.pos.x-m.pos.x,
    player.pos.y+1-m.pos.y-1.6,
    player.pos.z-m.pos.z
  ).normalize();
  fireballs.push({mesh,vel:dir.multiplyScalar(11),life:3});
}
function updateFireballs(dt){
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];
    f.life-=dt;
    f.mesh.position.addScaledVector(f.vel,dt);
    const dx=f.mesh.position.x-player.pos.x;
    const dy=f.mesh.position.y-(player.pos.y+1);
    const dz=f.mesh.position.z-player.pos.z;
    const hit=(Math.sqrt(dx*dx+dy*dy+dz*dz)<1);
    if(hit||f.life<=0){
      if(hit){
        damagePlayer(3);
        spawnParticles(f.mesh.position.x,f.mesh.position.y,f.mesh.position.z,0xff8833,10);
      }
      entityGroup.remove(f.mesh);
      f.mesh.geometry.dispose();
      f.mesh.material.dispose();
      fireballs.splice(i,1);
    }
  }
}
function explodeCreeper(m){
  spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0xffaa22,40);
  spawnParticles(m.pos.x,m.pos.y+1,m.pos.z,0x444444,24);
  const d=m.pos.distanceTo(player.pos);
  if(d<4.5){
    damagePlayer(Math.round(10*(1-d/4.5))+2);
    player.vel.y=8;
  }
  const cx=Math.floor(m.pos.x),cy=Math.floor(m.pos.y),cz=Math.floor(m.pos.z);
  for(let x=cx-2;x<=cx+2;x++)for(let y=cy-1;y<=cy+2;y++)for(let z=cz-2;z<=cz+2;z++){
    if(x===cx&&y===cy&&z===cz)continue;
    const t=getBlock(x,y,z);
    if(!t||t===30||t===15)continue;
    if(Math.random()<.55){
      setBlock(x,y,z,0,true);
      refreshChunkAt(x,z);
    }
  }
  refreshChunkAt(cx,cz);
}
function updateMobs(dt){
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    if(!m||m.hp<=0){
      if(m)mobs.splice(i,1);
      continue;
    }
    const d=m.pos.distanceTo(player.pos);
    if(d>72){
      entityGroup.remove(m.g);
      mobs.splice(i,1);
      continue;
    }
    m.anim+=dt;
    m.cd-=dt;
    m.hurt=Math.max(0,m.hurt-dt);
    m.g.rotation.y=Math.atan2(player.pos.x-m.pos.x,player.pos.z-m.pos.z);

    const gy=surfaceY(m.pos.x,m.pos.z,m.pos.y+3);
    if(!m.def.ranged&&gy!==null){
      if(m.pos.y>gy+.05)m.pos.y=Math.max(gy,m.pos.y-9*dt);
      else m.pos.y=gy;
    }

    let move;
    const hostile=player.mode!=="creative"&&d<22;
    if(hostile){
      move=new THREE.Vector3(player.pos.x-m.pos.x,0,player.pos.z-m.pos.z);
      if(move.lengthSq()>0)move.normalize();
    }else{
      m.wander-=dt;
      if(m.wander<=0){
        m.wander=2+Math.random()*3;
        m.dir.set(Math.random()-.5,0,Math.random()-.5);
        if(m.dir.lengthSq()>0)m.dir.normalize();
      }
      move=m.dir.clone();
    }

    const sp=m.def.speed;
    const nx=m.pos.x+move.x*sp*dt;
    const nz=m.pos.z+move.z*sp*dt;
    if(!isSolidAt(Math.floor(nx),Math.floor(m.pos.y+.6),Math.floor(m.pos.z)))m.pos.x=nx;
    else{
      m.dir.set(Math.random()-.5,0,Math.random()-.5);
      if(m.dir.lengthSq()>0)m.dir.normalize();
    }
    if(!isSolidAt(Math.floor(m.pos.x),Math.floor(m.pos.y+.6),Math.floor(nz)))m.pos.z=nz;
    else m.dir.multiplyScalar(-1);

    if(m.def.ranged&&gy!==null){
      m.pos.y=gy+1.35+Math.sin(m.anim*1.7)*.3;
    }

    m.g.scale.setScalar(1+m.hurt*0.9);

    if(hostile&&d<2.3&&m.cd<=0){
      damagePlayer(m.def.dmg);
      m.cd=1.5;
    }

    if(m.type==="creeper"&&d<3.4&&player.mode!=="creative"){
      m.fuse+=dt;
      if(m.fuse>1.4){
        explodeCreeper(m);
        entityGroup.remove(m.g);
        mobs.splice(i,1);
        continue;
      }
    }else if(m.type==="creeper"){
      m.fuse=Math.max(0,m.fuse-dt*2);
    }

    if(m.def.ranged&&d<16&&d>4){
      m.fireCD-=dt;
      if(m.fireCD<=0){
        m.fireCD=2.6;
        shootFireball(m);
      }
    }
  }
}
let spawnTimer=2;
function trySpawnMobs(dt){
  spawnTimer-=dt;
  if(spawnTimer>0)return;
  spawnTimer=3;
  if(mobs.length>=6)return;
  if(player.mode==="creative")return;
  const types=currentDim==="nether"?["piglin","blaze"]:["creeper"];
  const type=types[Math.floor(Math.random()*types.length)];
  const ang=Math.random()*Math.PI*2;
  const dist=13+Math.random()*14;
  const x=Math.floor(player.pos.x+Math.cos(ang)*dist);
  const z=Math.floor(player.pos.z+Math.sin(ang)*dist);
  ensureChunk(Math.floor(x/CS),Math.floor(z/CS));
  const y=surfaceY(x,z,player.pos.y+22);
  if(y===null)return;
  if(getBlock(x,y,z)===48||getBlock(x,y+1,z)===48)return;
  mobs.push(createMob(type,x+.5,y,z+.5));
}

/* ---------------- 玩家更新 ---------------- */
/* 找一块适合出生的陆地：以原点为中心螺旋向外搜索 */
function findSpawnPoint(){
  const isGood=(x,z)=>{
    const h=heightAt(x,z);
    if(h<SEA+2)return null;                 // 水面 / 沙滩
    const bi=biomeAt(x,z,h);
    if(bi===BIOME.OCEAN||bi===BIOME.BEACH)return null;
    return {x:x+.5,y:h+1.05,z:z+.5};
  };
  const near=isGood(8,8);
  if(near)return near;
  for(let r=16;r<=768;r+=16){
    const steps=Math.max(8,Math.floor(r/6));
    for(let i=0;i<steps;i++){
      const a=i/steps*Math.PI*2;
      const p=isGood(Math.round(8+Math.cos(a)*r),Math.round(8+Math.sin(a)*r));
      if(p)return p;
    }
  }
  return {x:8.5,y:SEA+3,z:8.5};
}
function placePlayer(){
  const sp=findSpawnPoint();
  player.pos.set(sp.x,sp.y,sp.z);
  player.vel.set(0,0,0);
  const cx=Math.floor(player.pos.x/CS),cz=Math.floor(player.pos.z/CS);
  ensureChunk(cx,cz);
  const y=surfaceY(player.pos.x,player.pos.z,WH_MAX-4);
  if(y!==null)player.pos.y=y+0.15;
  player.spawn.copy(player.pos);
  player.ready=true;
  updateChunks(true);
}
function tryMove(dx,dy,dz){
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))/0.2));
  const sx=dx/steps,sy=dy/steps,sz=dz/steps;
  for(let i=0;i<steps;i++){
    if(sx!==0){
      player.pos.x+=sx;
      if(playerCollides(player.pos.x,player.pos.y,player.pos.z)){
        player.pos.x-=sx;
        player.vel.x=0;
      }
    }
    if(sz!==0){
      player.pos.z+=sz;
      if(playerCollides(player.pos.x,player.pos.y,player.pos.z)){
        player.pos.z-=sz;
        player.vel.z=0;
      }
    }
    if(sy!==0){
      player.pos.y+=sy;
      if(playerCollides(player.pos.x,player.pos.y,player.pos.z)){
        player.pos.y-=sy;
        if(sy<0){
          player.onGround=true;
          if(player.fallSpeed<-20)damagePlayer(Math.min(12,Math.floor((-player.fallSpeed-20)/3)));
          player.fallSpeed=0;
        }
        player.vel.y=0;
        break;
      }
    }
  }
}
function updatePlayer(dt){
  if(!player.ready)return;

  player.hurtCD=Math.max(0,player.hurtCD-dt);

  const feet=getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y),Math.floor(player.pos.z));
  const head=getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y+EYE),Math.floor(player.pos.z));
  player.inWater=(feet===7||head===7);

  if(feet===48||head===48){
    damagePlayer(4);
    if(player.vel.y<2)player.vel.y=2;
  }

  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  const wish=new THREE.Vector3();
  if(keys["KeyW"])wish.add(fwd);
  if(keys["KeyS"])wish.sub(fwd);
  if(keys["KeyD"])wish.add(right);
  if(keys["KeyA"])wish.sub(right);
  if(wish.lengthSq()>0)wish.normalize();

  const sprint=!!keys["ShiftLeft"]&&!player.flying&&!player.inWater;
  let speed=player.mode==="creative"&&player.flying?FLY_SPEED:(sprint?SPRINT_SPEED:WALK_SPEED);
  if(player.inWater)speed*=.6;

  if(player.flying){
    player.vel.x=wish.x*speed;
    player.vel.z=wish.z*speed;
    let vy=0;
    if(keys["Space"])vy+=speed;
    if(keys["ShiftLeft"])vy-=speed;
    player.vel.y=vy;
    player.onGround=false;
  }else{
    const accel=player.onGround?18:9;
    player.vel.x+=(wish.x*speed-player.vel.x)*Math.min(1,accel*dt);
    player.vel.z+=(wish.z*speed-player.vel.z)*Math.min(1,accel*dt);
    player.vel.y+=GRAVITY*dt*(player.inWater?.35:1);
    if(player.inWater)player.vel.y=Math.max(player.vel.y,-3.2);
    if(keys["Space"]){
      if(player.onGround){
        player.vel.y=JUMP_SPEED;
        player.onGround=false;
      }else if(player.inWater){
        player.vel.y=Math.min(player.vel.y+14*dt*4,4.2);
      }
    }
    if(player.vel.y<-42)player.vel.y=-42;
  }

  const wasGround=player.onGround;
  player.onGround=false;
  if(player.vel.y<0)player.fallSpeed=player.vel.y;
  tryMove(player.vel.x*dt,player.vel.y*dt,player.vel.z*dt);
  if(!wasGround&&player.onGround)player.fallSpeed=0;

  if(player.pos.y<BED_MIN-12){
    player.pos.y=BED_MIN-6;
    player.vel.y=0;
    damagePlayer(6);
  }

  camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0);

  if(player.mode!=="creative"){
    const drain=sprint&&wish.lengthSq()>0?.03:.012;
    player.food=Math.max(0,player.food-drain*dt*10);
    if(player.food>16&&player.health<20){
      player.health=Math.min(20,player.health+dt*.7);
    }else if(player.food<=0){
      player.health=Math.max(0,player.health-dt*1.2);
      if(player.health<=0)die();
    }
  }
  player.xp+=dt*1.2;
  updatePortal(dt);
  statsTimer-=dt;
  if(statsTimer<=0){
    statsTimer=.25;
    renderStats();
  }
}

/* ---------------- 昼夜 / 环境 ---------------- */
const DAY_LEN=360;
let worldTime=DAY_LEN*0.22;
const tmpSky=new THREE.Color();

function updateEnvironment(dt){
  worldTime+=dt;
  if(currentDim==="nether"){
    tmpSky.setHex(0x2a0c0c);
    scene.background.copy(tmpSky);
    scene.fog.color.copy(tmpSky);
    scene.fog.near=6;
    scene.fog.far=58;
    sun.intensity=.22;
    sun.position.set(player.pos.x+20,player.pos.y+40,player.pos.z+10);
    sun.target.position.copy(player.pos);
    moon.intensity=.08;
    hemi.intensity=.5;
    hemi.color.setHex(0xff9977);
    hemi.groundColor.setHex(0x6a2a18);
    return;
  }
  const f=(worldTime%DAY_LEN)/DAY_LEN;
  const ang=f*Math.PI*2;
  const height=Math.sin(ang);
  const lightFactor=clamp(height*1.5+.34,.06,1);

  tmpSky.copy(SKY_NIGHT).lerp(SKY_DAY,lightFactor);
  scene.background.copy(tmpSky);
  scene.fog.color.copy(tmpSky);
  scene.fog.near=45;
  scene.fog.far=105;

  sun.intensity=1.65*lightFactor;
  moon.intensity=.5*(1-lightFactor)+.05;
  hemi.intensity=.32+.85*lightFactor;
  hemi.color.setHex(0xaaccee);
  hemi.groundColor.setHex(0x445522);

  sun.position.set(
    player.pos.x+Math.cos(ang)*70,
    player.pos.y+height*90,
    player.pos.z+32
  );
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();
  moon.position.set(player.pos.x-Math.cos(ang)*60,player.pos.y-height*70,player.pos.z-30);
}

/* ---------------- 存档 ---------------- */
function serializeList(list){
  return list.map(s=>s?[s.id,s.count]:0);
}
function deserializeList(arr){
  if(!Array.isArray(arr))return null;
  return arr.map(v=>(Array.isArray(v)&&v[0])?{id:v[0],count:v[1]}:null);
}
function saveWorld(){
  try{
    const data={
      v:1,
      dim:currentDim,
      pos:[player.pos.x,player.pos.y,player.pos.z],
      spawn:[player.spawn.x,player.spawn.y,player.spawn.z],
      yaw:player.yaw,
      pitch:player.pitch,
      mode:player.mode,
      health:player.health,
      food:player.food,
      selected:player.selected,
      inv:serializeList(inventory),
      hb:serializeList(hotbar),
      time:worldTime,
      edits:{
        overworld:Array.from(EDITS.overworld.entries()),
        nether:Array.from(EDITS.nether.entries())
      },
      chests:{
        overworld:Array.from(CHESTS.overworld.entries()),
        nether:Array.from(CHESTS.nether.entries())
      }
    };
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    toast("💾 世界已保存");
  }catch(err){
    toast("保存失败："+err.message);
  }
}
function loadWorld(){
  let raw=null;
  try{
    raw=localStorage.getItem(SAVE_KEY);
  }catch(err){
    return false;
  }
  if(!raw)return false;
  let data;
  try{
    data=JSON.parse(raw);
  }catch(err){
    return false;
  }
  if(!data||data.v!==1)return false;

  WORLDS.overworld.clear();
  WORLDS.nether.clear();
  EDITS.overworld.clear();
  EDITS.nether.clear();
  CHESTS.overworld.clear();
  CHESTS.nether.clear();
  GENERATED.overworld.clear();
  GENERATED.nether.clear();

  const applyEdits=(target,arr)=>{
    if(!Array.isArray(arr))return;
    for(const pair of arr){
      if(!Array.isArray(pair))continue;
      target.set(pair[0],pair[1]);
    }
  };
  applyEdits(EDITS.overworld,data.edits&&data.edits.overworld);
  applyEdits(EDITS.nether,data.edits&&data.edits.nether);

  const applyChests=(target,arr)=>{
    if(!Array.isArray(arr))return;
    for(const pair of arr){
      if(!Array.isArray(pair))continue;
      const list=Array.isArray(pair[1])?pair[1].map(v=>(Array.isArray(v)&&v[0])?{id:v[0],count:v[1]}:null):new Array(27).fill(null);
      target.set(pair[0],list);
    }
  };
  applyChests(CHESTS.overworld,data.chests&&data.chests.overworld);
  applyChests(CHESTS.nether,data.chests&&data.chests.nether);

  currentDim=(data.dim==="nether")?"nether":"overworld";
  if(Array.isArray(data.pos)){
    player.pos.set(data.pos[0],data.pos[1],data.pos[2]);
  }
  if(Array.isArray(data.spawn)){
    player.spawn.set(data.spawn[0],data.spawn[1],data.spawn[2]);
  }
  player.yaw=data.yaw||0;
  player.pitch=data.pitch||0;
  player.mode=(data.mode==="creative")?"creative":"survival";
  player.flying=player.mode==="creative";
  player.health=typeof data.health==="number"?data.health:20;
  player.food=typeof data.food==="number"?data.food:20;
  player.selected=clamp(data.selected|0,0,8);
  worldTime=typeof data.time==="number"?data.time:worldTime;

  const inv=deserializeList(data.inv);
  if(inv)for(let i=0;i<27;i++)inventory[i]=inv[i]||null;
  const hb=deserializeList(data.hb);
  if(hb)for(let i=0;i<9;i++)hotbar[i]=hb[i]||null;

  player.ready=true;
  resetChunkCaches();
  updateChunks(true);
  camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
  renderHotbar();
  renderInventory();
  renderStats();
  toast("已读取存档");
  return true;
}

let actx=null;
function audioCtx(){
  if(!actx){
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(err){actx=null;}
  }
  if(actx&&actx.state==="suspended")actx.resume();
  return actx;
}
function tone(freq,dur,type,vol,slide){
  const ctx=audioCtx();
  if(!ctx)return;
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type=type||"square";
  o.frequency.setValueAtTime(freq,ctx.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),ctx.currentTime+dur);
  g.gain.setValueAtTime(vol||.05,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+dur);
}
function noiseBurst(dur,vol,freq){
  const ctx=audioCtx();
  if(!ctx)return;
  const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource();
  src.buffer=buf;
  const f=ctx.createBiquadFilter();
  f.type="lowpass";
  f.frequency.value=freq||1200;
  const g=ctx.createGain();
  g.gain.value=vol||.1;
  src.connect(f);
  f.connect(g);
  g.connect(ctx.destination);
  src.start();
}
const SFX={

};
