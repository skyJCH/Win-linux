/* ============================================================

/* 修正版：平时保留区块数据（回头不用重新生成），
   只在总量接近 V8 上限时才裁掉最远的区块。 */
const MAX_BLOCK_ENTRIES=4000000;      /* 超过就裁（约占 V8 上限 24%，内存友好） */
const TRIM_TARGET=2200000;            /* 裁到这个水位以下 */
const PURGE_PER_CALL=10;

/* 删除一个区块的全部方块 / 元数据 / 信号 / 作物登记 */
function purgeChunkData(cx,cz){
  const k=chunkKey(cx,cz);
  const world=WORLDS[currentDim];
  const x0=cx*CS,z0=cz*CS;
  const x1=x0+CS,z1=z0+CS;
  for(let x=x0;x<x1;x++){
    for(let z=z0;z<z1;z++){
      const col=(x+BLK_OFF)*BLK_AXIS+(z+BLK_OFF);
      for(let y=WH_MIN;y<WH_MAX;y++)world.delete(col*128+(y+BLK_Y));
    }
  }
  if(typeof META!=="undefined"&&META[currentDim]){
    const meta=META[currentDim];
    for(let x=x0;x<x1;x++){
      for(let z=z0;z<z1;z++){
        const col=(x+BLK_OFF)*BLK_AXIS+(z+BLK_OFF);
        for(let y=WH_MIN;y<WH_MAX;y++)meta.delete(col*128+(y+BLK_Y));
      }
    }
  }
  if(typeof REDSTONE!=="undefined"&&REDSTONE[currentDim])REDSTONE[currentDim].clear();
  if(typeof CROPS!=="undefined"){
    for(const ck of CROPS){
      const p=unblockKey(ck);
      if(p&&p[0]>=x0&&p[0]<x1&&p[2]>=z0&&p[2]<z1)CROPS.delete(ck);
    }
  }
  /* 清掉"已生成"标记：以后回来会按种子重新生成并用 EDITS 还原 */
  GENERATED[currentDim].delete(k);
  if(typeof VILLAGES!=="undefined"){
    for(const vk of VILLAGES){
      const info=VILLAGE_INFO.get(vk);
      if(info&&info.x>=x0&&info.x<x1&&info.z>=z0&&info.z<z1){
        VILLAGES.delete(vk);
        VILLAGE_INFO.delete(vk);
      }
    }
  }
}

/* unloadChunk 仍然只负责网格（在另一处已覆盖），这里不再动数据 */

/* 核心：方块数据太多时，按距离从远到近裁掉「当前没加载」的区块 */
function trimWorldData(){
  const world=WORLDS[currentDim];
  if(world.size<=MAX_BLOCK_ENTRIES)return false;

  const pcx=Math.floor(player.pos.x/CS),pcz=Math.floor(player.pos.z/CS);
  /* 候选：生成过的、且已经不在卸载半径内的区块（不会反复重建），
     但玩家最内圈（距离 <= RENDER_RADIUS-1）永远保留 */
  const candidates=[];
  for(const key of GENERATED[currentDim]){
    const [cx,cz]=key.split(",").map(Number);
    const d=Math.max(Math.abs(cx-pcx),Math.abs(cz-pcz));
    if(d<=UNLOAD_RADIUS)continue;                 /* 已加载范围不动，避免反复重建 */
    candidates.push({cx,cz,d});
  }
  if(!candidates.length)return false;
  candidates.sort((a,b)=>b.d-a.d);            /* 最远的先裁 */

  for(let i=0;i<candidates.length;i++){
    if(world.size<=TRIM_TARGET)break;
    if(i>=PURGE_PER_CALL*3)break;             /* 单次最多处理这么多，避免卡 */
    const key=chunkKey(candidates[i].cx,candidates[i].cz);
    purgeChunkData(candidates[i].cx,candidates[i].cz);
    /* 已经加载的区块被裁掉后，网格也要移除，下一帧会按需重建 */
    if(loadedChunks.has(key)){
      const mesh=chunkMeshes.get(key);
      if(mesh){scene.remove(mesh);mesh.geometry.dispose();chunkMeshes.delete(key);}
      const w=waterMeshes.get(key);
      if(w){scene.remove(w);w.geometry.dispose();waterMeshes.delete(key);}
      clearGlows(candidates[i].cx,candidates[i].cz);
      loadedChunks.delete(key);
    }
  }
  return true;
}

/* 每 2 秒检查一次；正常情况下永远不触发 */
let trimTimer=0;
const _animate23=animate;
animate=function(now){
  const dt=Math.min(.05,(now-lastFrame)/1000);
  trimTimer-=dt;
  if(trimTimer<=0&&started){
    trimTimer=0.4;
    trimWorldData();
  }
  _animate23(now);
};

/* 切维度前也检查一次 */
const _switchDimension23=switchDimension;
switchDimension=function(){
  trimWorldData();
  _switchDimension23();
};

/* ============================================================
   第二十四部分：光影优化（运行时零额外开销）
   ------------------------------------------------------------
   所有提升都发生在"建网格时算一次"或"改一个颜色值"，
   不增加每帧工作量、不增加绘制调用、不加后处理。
     1. 天空光烘焙：按"该列露天高度"把洞穴/树荫压暗，写进顶点色
     2. 阳光颜色按时段渐变：清晨/黄昏暖橙，正午偏白，夜间偏蓝
     3. 半球光 / 环境光随时段过渡，洞穴不再纯黑
     4. 阴影相机收紧（贴图尺寸不变，覆盖范围变小 → 阴影更锐利）
     5. 水下雾色 + 视野收缩
   ============================================================ */

/* ---------------- 1. 天空光烘焙 ---------------- */
/* 每列"露天高度"缓存（按区块），避免每次重建都重新扫描 */
const chunkTopCache=new Map();

/* buildChunk 刚填好的体素缓冲（VOX 含 -1..CS 的外圈，正好覆盖 18x18） */
let voxBufChunkKey="";
function buildChunkTops(cx,cz){
  const N=CS+2;
  const tops=new Int16Array(N*N);
  const k=chunkKey(cx,cz);
  if(typeof voxBuf!=="undefined"&&voxBufChunkKey===k){
    /* 快路径：直接读定型数组，零 Map 查找 */
    for(let lx=-1;lx<=CS;lx++){
      for(let lz=-1;lz<=CS;lz++){
        let ty=WH_MIN;
        for(let y=WH_MAX-1;y>=WH_MIN;y--){
          if(voxBuf[voxIndex(lx,y,lz)]){ty=y;break;}
        }
        tops[(lx+1)*N+(lz+1)]=ty;
      }
    }
    return tops;
  }
  /* 慢路径（兜底）：正常走世界查询 */
  const x0=cx*CS,z0=cz*CS;
  for(let lx=-1;lx<=CS;lx++){
    for(let lz=-1;lz<=CS;lz++){
      const wx=x0+lx,wz=z0+lz;
      let ty=WH_MIN;
      for(let y=WH_MAX-1;y>=WH_MIN;y--){
        if(getBlock(wx,y,wz)){ty=y;break;}
      }
      tops[(lx+1)*N+(lz+1)]=ty;
    }
  }
  return tops;
}

/* 把环境光写进顶点色：贴地 1.0，越深越暗，深处偏冷 */
function bakeSkylight(cx,cz){
  const k=chunkKey(cx,cz);
  const mesh=chunkMeshes.get(k);
  if(!mesh||!mesh.geometry)return;
  const posAttr=mesh.geometry.attributes.position;
  const colAttr=mesh.geometry.attributes.color;
  if(!posAttr||!colAttr)return;

  let tops=chunkTopCache.get(k);
  if(!tops){
    tops=buildChunkTops(cx,cz);
    chunkTopCache.set(k,tops);
    /* 缓存不能无限增长 */
    if(chunkTopCache.size>256){
      const iter=chunkTopCache.keys();
      const first=iter.next().value;
      chunkTopCache.delete(first);
    }
  }

  const N=CS+2;
  const x0=cx*CS,z0=cz*CS;
  const topAt=(lx,lz)=>{
    const a=lx<-1?-1:(lx>CS?CS:lx);
    const b=lz<-1?-1:(lz>CS?CS:lz);
    return tops[(a+1)*N+(b+1)];
  };

  const count=posAttr.count;
  const parr=posAttr.array;
  const carr=colAttr.array;
  for(let i=0;i<count;i++){
    const vx=parr[i*3],vy=parr[i*3+1],vz=parr[i*3+2];
    const lx=Math.floor(vx)-x0;
    const lz=Math.floor(vz)-z0;
    const by=Math.floor(vy-1e-4);
    /* 本列与四邻平均，过渡更柔和 */
    const t0=topAt(lx,lz);
    const t1=topAt(lx+1,lz),t2=topAt(lx-1,lz);
    const t3=topAt(lx,lz+1),t4=topAt(lx,lz-1);
    const top=(t0*3+t1+t2+t3+t4)/7;
    const depth=top-by;
    let sky=1;
    if(depth>0){
      sky=1-depth*0.075;
      if(sky<0.20)sky=0.20;
    }
    const cool=(1-sky)*0.6;
    carr[i*3]  =carr[i*3]  *sky*(1-cool*0.32);
    carr[i*3+1]=carr[i*3+1]*sky*(1-cool*0.12);
    carr[i*3+2]=carr[i*3+2]*sky*(1+cool*0.10);
    if(carr[i*3]>1)carr[i*3]=1;
    if(carr[i*3+1]>1)carr[i*3+1]=1;
    if(carr[i*3+2]>1)carr[i*3+2]=1;
  }
  colAttr.needsUpdate=true;
}

/* 建完网格立刻烘焙 */
let bakeSkylightEnabled=true;
const _buildChunk24=buildChunk;
buildChunk=function(cx,cz){
  _buildChunk24(cx,cz);
  if(!bakeSkylightEnabled)return;
  /* 此时 voxBuf 里就是刚建的这个区块，烘焙可直接复用 */
  voxBufChunkKey=chunkKey(cx,cz);
  bakeSkylight(cx,cz);
};

/* 区块被重建（放置/破坏方块）后列高会变 → 清缓存重算 */
const _refresh24=refreshChunkAt;
refreshChunkAt=function(x,z){
  const cx=Math.floor(x/CS),cz=Math.floor(z/CS);
  chunkTopCache.delete(chunkKey(cx,cz));
  _refresh24(x,z);
};
const _purge24=purgeChunkData;
purgeChunkData=function(cx,cz){
  chunkTopCache.delete(chunkKey(cx,cz));
  _purge24(cx,cz);
};
const _reset24=resetChunkCaches;
resetChunkCaches=function(){
  chunkTopCache.clear();
  _reset24();
};

/* ---------------- 2. 阳光 / 天空颜色时段渐变 ---------------- */
const SKY_NOON=new THREE.Color(0x84bdf0);
const SKY_DAWN=new THREE.Color(0xff9a5c);
const SKY_DUSK=new THREE.Color(0xbc5a72);
const SUN_DAWN=new THREE.Color(0xffb070);
const SUN_NOON=new THREE.Color(0xfff6e2);
const SUN_NIGHT=new THREE.Color(0x8fa8e8);
const HEMI_WHITE=new THREE.Color(0xffffff);

const _updateEnv24=updateEnvironment;
updateEnvironment=function(dt){
  _updateEnv24(dt);
  if(currentDim==="nether")return;

  const f=(worldTime%DAY_LEN)/DAY_LEN;
  const elev=Math.sin(f*Math.PI*2);
  const day=clamp(elev*2.2,0,1);

  /* 天空底色：白天蓝 → 低角度暖橙 → 夜晚深蓝 */
  if(elev>0){
    tmpSky.copy(SKY_NOON);
    const horizon=clamp(1-elev*3,0,1);
    tmpSky.lerp(SKY_DAWN,horizon*0.8);
  }else{
    tmpSky.copy(SKY_DAY).lerp(SKY_NIGHT,clamp(-elev*2.2,0,1));
    const horizon=clamp(1+elev*3,0,1);
    tmpSky.lerp(SKY_DUSK,horizon*0.25);
  }
  scene.background.copy(tmpSky);
  scene.fog.color.copy(tmpSky);

  /* 阳光颜色：正午偏白，低角度偏橙，夜里换月光蓝 */
  if(elev>0.02){
    sun.color.copy(SUN_NOON);
    sun.color.lerp(SUN_DAWN,clamp(1-elev*3,0,1)*0.85);
  }else{
    sun.color.copy(SUN_NIGHT);
  }

  /* 半球光跟着天色走；夜晚把环境光抬高一点，洞穴不至于全黑 */
  hemi.color.copy(tmpSky).lerp(HEMI_WHITE,0.25);
  hemi.groundColor.setHex(day>0.5?0x4a5a2a:0x2a3442);
  ambientFill.color.copy(tmpSky).lerp(HEMI_WHITE,0.5);
  ambientFill.intensity=0.13+day*0.09;

  /* 阴影相机收紧：贴图还是 2048，但范围 104 → 80，阴影更锐利 */
  const sc=sun.shadow.camera;
  if(sc.right!==40){
    sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;
    sc.near=1;sc.far=180;
    if(typeof sc.updateProjectionMatrix==="function")sc.updateProjectionMatrix();
  }

  /* 水下：近处蓝雾 */
  if(player.inWater){
    scene.fog.color.setHex(0x123a5c);
    scene.fog.near=2;
    scene.fog.far=26;
  }
};
